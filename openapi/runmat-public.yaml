components:
  schemas:
    AcceleratorAllocationDomainIdBody:
      type: string
    AcceleratorClassBody:
      type: string
    AcceleratorDeviceBody:
      type: object
      required:
      - id
      - allocationDomain
      - class
      - provider
      - maxAllocationBytes
      - features
      - inventoryEpoch
      properties:
        allocationDomain:
          $ref: '#/components/schemas/AcceleratorAllocationDomainIdBody'
        class:
          $ref: '#/components/schemas/AcceleratorClassBody'
        features:
          type: array
          items:
            $ref: '#/components/schemas/AcceleratorFeatureBody'
        id:
          $ref: '#/components/schemas/AcceleratorDeviceIdBody'
        inventoryEpoch:
          type: integer
          format: int64
          minimum: 0
        maxAllocationBytes:
          type: integer
          format: int64
          minimum: 0
        provider:
          $ref: '#/components/schemas/AcceleratorProviderBody'
      additionalProperties: false
    AcceleratorDeviceIdBody:
      type: string
    AcceleratorFeatureBody:
      oneOf:
      - type: string
        enum:
        - compute
      - type: string
        enum:
        - unified_memory
      - type: string
        enum:
        - peer_to_peer
      - type: string
        enum:
        - confidential_compute
      - type: object
        required:
        - custom
        properties:
          custom:
            type: string
    AcceleratorProviderBody:
      type: object
      required:
      - id
      - version
      - abiFingerprint
      properties:
        abiFingerprint:
          $ref: '#/components/schemas/DigestBody'
        id:
          $ref: '#/components/schemas/AcceleratorProviderIdBody'
        version:
          $ref: '#/components/schemas/AcceleratorProviderVersionBody'
      additionalProperties: false
    AcceleratorProviderIdBody:
      type: string
    AcceleratorProviderVersionBody:
      type: string
    AcceleratorRequestBody:
      type: object
      required:
      - class
      - count
      - minimumAllocationBytes
      - requiredFeatures
      properties:
        class:
          $ref: '#/components/schemas/AcceleratorClassBody'
        count:
          type: integer
          format: int32
          minimum: 0
        minimumAllocationBytes:
          type: integer
          format: int64
          minimum: 0
        provider:
          allOf:
          - $ref: '#/components/schemas/AcceleratorProviderBody'
          nullable: true
        requiredFeatures:
          type: array
          items:
            $ref: '#/components/schemas/AcceleratorFeatureBody'
      additionalProperties: false
    AccountNameLockedReason:
      type: string
      description: Why the name cannot be edited.
      enum:
      - managed_by_directory
      - service_account
    AccountNameSettings:
      type: object
      required:
      - editable
      - source
      properties:
        editable:
          type: boolean
        lockedReason:
          allOf:
          - $ref: '#/components/schemas/AccountNameLockedReason'
          nullable: true
        source:
          $ref: '#/components/schemas/AccountNameSource'
    AccountNameSource:
      type: string
      description: Who set the account name.
      enum:
      - provider
      - user
      - directory
    AdvisoryRequest:
      type: object
      required:
      - affectedRequirement
      - severity
      - title
      properties:
        affectedRequirement:
          type: string
        severity:
          $ref: '#/components/schemas/AdvisorySeverityRequest'
        title:
          type: string
        url:
          type: string
          nullable: true
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    AdvisorySeverityRequest:
      type: string
      enum:
      - low
      - moderate
      - high
      - critical
