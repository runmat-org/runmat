name: Offline scientific qualification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  fea-conformance:
    name: fea-conformance
    runs-on: ubuntu-latest-gpu
    env:
      RUST_BACKTRACE: 1
      RUNMAT_ANALYSIS_ENFORCE_BASELINE_ON_PROTECTED: "true"
      RUNMAT_ANALYSIS_PROTECTED_BRANCHES: "main,master,release"
      RUNMAT_ANALYSIS_BASELINE_DIR: ${{ github.workspace }}/target/runmat-analysis-artifacts/rolling
      RUNMAT_FEA_BASELINE_DIR: ${{ github.workspace }}/target/runmat-analysis-artifacts/rolling
      RUNMAT_ANALYSIS_BASELINE_WINDOW: "12"
      RUNMAT_ANALYSIS_MAX_SLOWDOWN_RATIO: "1.35"
      RUNMAT_ANALYSIS_MAX_COST_SLOWDOWN_RATIO: "1.5"
      RUNMAT_ANALYSIS_MIN_SPEEDUP_RETENTION: "0.8"
      RUNMAT_ANALYSIS_ARTIFACT_PATH: ${{ github.workspace }}/target/runmat-analysis-artifacts/analysis_benchmark_report.json
      RUNMAT_FEA_ARTIFACT_PATH: ${{ github.workspace }}/target/runmat-analysis-artifacts/analysis_benchmark_report.json
      RUNMAT_ANALYSIS_ARTIFACT_ROOT: ${{ github.workspace }}/target/runmat-analysis-artifacts
      RUNMAT_FEA_ARTIFACT_ROOT: ${{ github.workspace }}/target/runmat-analysis-artifacts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.90.0

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies (BLAS/LAPACK, ZMQ, OpenSSL)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libhdf5-dev libopenblas-dev liblapack-dev libssl-dev \
            libzmq3-dev pkg-config ca-certificates

      # Ordinary package tests already run in geometry-analysis. Do not bypass
      # its scientific routing with another unfiltered Cargo invocation.
      - name: Verify scientific source and qualification receipts
        run: python3 scripts/qualification/scientific.py verify

      - name: Qualify exact-f64 resident sparse execution
        env:
          RUNMAT_REQUIRE_WGPU_SPARSE: "1"
          RUNMAT_REQUIRE_WGPU_F64: "1"
        run: cargo test -p runmat-accelerate --all-features --lib exact_f64_sparse_cg_is_executed_or_rejected_by_adapter_capability -- --test-threads=1 --nocapture

      - name: Run FEA execution placement conformance
        run: cargo test -p runmat-execution-runner-native --test analysis_process_conformance

      - name: Run FEA runtime contract tests
        run: cargo test -p runmat-runtime --test operation_contracts

      - name: Run FEA benchmark conformance
        id: fea_benchmark_conformance
        run: cargo test -p runmat-runtime --test analysis

      - name: Verify filesystem artifact replay stability
        env:
          RUNMAT_ANALYSIS_ARTIFACT_STORE: filesystem
          RUNMAT_ANALYSIS_ARTIFACT_ROOT: target/runmat-analysis-store
          RUNMAT_ANALYSIS_ARTIFACT_MAX_RUNS: "0"
          RUNMAT_ANALYSIS_ARTIFACT_MAX_RUNS_PER_KIND: "0"
        run: cargo test -p runmat-runtime analysis::tests::analysis_results_by_run_id_filesystem_replay_is_stable

      - name: Mark artifact replay verification passed
        if: success()
        run: echo "RUNMAT_RELEASE_READINESS_ARTIFACT_REPLAY_OK=true" >> "$GITHUB_ENV"

      - name: Validate FEA conformance report keys
        run: python3 scripts/fea/governance/validate_fea_conformance_report.py

      - name: Enforce thermo summary presence on thermo-gated branches
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/')
        env:
          RUNMAT_VALIDATE_REQUIRE_THERMO_SUMMARY: "true"
          RUNMAT_VALIDATE_REQUIRE_THERMO_FIELD_SUMMARY: "true"
          RUNMAT_VALIDATE_REQUIRE_ELECTRO_SUMMARY: "true"
          RUNMAT_VALIDATE_REQUIRE_PLASTIC_SUMMARY: "true"
          RUNMAT_VALIDATE_REQUIRE_CONTACT_SUMMARY: "true"
        run: python3 scripts/fea/governance/validate_fea_conformance_report.py

      - name: Test FEA script logic
        run: scripts/test-fea-scripts.sh

      - name: Analyze nonlinear rolling trends
        if: always()
        env:
          RUNMAT_ANALYSIS_TREND_WINDOW: "8"
          RUNMAT_ANALYSIS_TREND_MAX_SLOWDOWN_RATIO: "1.25"
        run: |
          python3 scripts/fea/reporting/analyze_nonlinear_trends.py | tee nonlinear-trends.md
          cat nonlinear-trends.md >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize FEA conformance report
        if: always()
        run: |
          python3 scripts/fea/reporting/summarize_analysis_report.py | tee fea-conformance-summary.md
          cat fea-conformance-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate promotion threshold calibration
        if: always()
        run: python3 scripts/fea/governance/generate_promotion_threshold_calibration.py

      - name: Validate promotion threshold calibration
        if: always()
        env:
          RUNMAT_VALIDATE_PROMOTION_CALIBRATION_ENFORCE: "true"
          RUNMAT_VALIDATE_PROMOTION_CALIBRATION_REQUIRE_CADENCE: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/') }}
          RUNMAT_VALIDATE_PROMOTION_CALIBRATION_MIN_SOURCE_REPORTS: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/')) && '4' || '0' }}
          RUNMAT_PROMOTION_THRESHOLD_CALIBRATION_INPUT: target/runmat-analysis-artifacts/promotion_threshold_calibration.json
        run: python3 scripts/fea/governance/validate_promotion_threshold_calibration.py

      - name: Generate external reference benchmark artifact
        if: always()
        env:
          RUNMAT_EXTERNAL_REFERENCE_REPORT_PATH: target/runmat-analysis-artifacts/analysis_benchmark_report.json
          RUNMAT_EXTERNAL_REFERENCE_BASELINE_PATH: scripts/fea/reference_data/fea_l2_external_reference_baseline.json
          RUNMAT_EXTERNAL_REFERENCE_BENCHMARK_PATH: target/runmat-analysis-artifacts/external_reference_benchmark.json
        run: python3 scripts/fea/governance/generate_external_reference_benchmark.py

      - name: Validate external reference benchmark artifact
        if: always()
        env:
          RUNMAT_EXTERNAL_REFERENCE_BENCHMARK_PATH: target/runmat-analysis-artifacts/external_reference_benchmark.json
          RUNMAT_VALIDATE_EXTERNAL_REFERENCE_ENFORCE: "true"
          RUNMAT_VALIDATE_EXTERNAL_REFERENCE_REQUIRE_PASS: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/') }}
        run: python3 scripts/fea/governance/validate_external_reference_benchmark.py

      - name: Evaluate FEA release readiness
        if: always()
        env:
          RUNMAT_RELEASE_READINESS_MAX_SLOWDOWN_RATIO: "1.25"
          RUNMAT_RELEASE_READINESS_REQUIRE_PROMOTION_READY: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/') }}
          RUNMAT_RELEASE_READINESS_REQUIRE_PROMOTION_CALIBRATION: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/') }}
          RUNMAT_RELEASE_READINESS_PROMOTION_CALIBRATION: target/runmat-analysis-artifacts/promotion_threshold_calibration.json
        run: |
          python3 scripts/fea/governance/release_readiness_fea.py | tee fea-release-readiness.md
          cat fea-release-readiness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate threshold ratchet report
        if: always()
        run: |
          python3 scripts/fea/governance/generate_threshold_ratchet_report.py | tee threshold-ratchet.md
          cat threshold-ratchet.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate threshold ratchet report
        if: always()
        env:
          RUNMAT_VALIDATE_THRESHOLD_RATCHET_ENFORCE: "true"
          RUNMAT_VALIDATE_THRESHOLD_RATCHET_REQUIRE_OBSERVED: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/') }}
        run: python3 scripts/fea/governance/validate_threshold_ratchet_report.py

      - name: Summarize governance artifacts
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ready_path = Path("target/runmat-analysis-artifacts/fea_release_readiness.json")
          ratchet_path = Path("target/runmat-analysis-artifacts/threshold_ratchet_report.json")
          promotion_calib_path = Path("target/runmat-analysis-artifacts/promotion_threshold_calibration.json")
          external_ref_path = Path("target/runmat-analysis-artifacts/external_reference_benchmark.json")
          lines = ["## Tier 7.5 Governance", ""]
          if ready_path.exists():
              ready = json.loads(ready_path.read_text())
              lines.append(f"- Governance profile: {ready.get('governance_profile', 'unknown')}")
              lines.append(f"- Readiness verdict: {ready.get('verdict', 'unknown')}")
              thermo_enabled_rate = ready.get('thermo_coupling_enabled_rate')
              thermo_max_transient = ready.get('thermo_max_transient_severity')
              thermo_max_nonlinear = ready.get('thermo_max_nonlinear_severity')
              thermo_max_spread = ready.get('thermo_max_spread_ratio')
              thermo_spread_threshold = ready.get('thermo_max_spread_ratio_threshold')
              thermo_max_heterogeneity = ready.get('thermo_max_heterogeneity_index')
              thermo_min_field_coverage = ready.get('thermo_min_field_coverage_ratio')
              thermo_field_coverage_threshold = ready.get('thermo_min_field_coverage_ratio_threshold')
              thermo_max_field_extrapolation = ready.get('thermo_max_field_extrapolation_ratio')
              thermo_field_extrapolation_threshold = ready.get('thermo_max_field_extrapolation_ratio_threshold')
              thermo_field_coverage_drop_trend_ratio = ready.get('thermo_field_coverage_drop_trend_ratio')
              thermo_field_coverage_drop_trend_threshold = ready.get('thermo_max_field_coverage_drop_trend_ratio')
              thermo_field_extrapolation_trend_ratio = ready.get('thermo_field_extrapolation_trend_ratio')
              thermo_field_extrapolation_trend_threshold = ready.get('thermo_max_field_extrapolation_trend_ratio')
              thermo_spread_breach_rate = ready.get('thermo_spread_breach_rate')
              thermo_heterogeneity_breach_rate = ready.get('thermo_heterogeneity_breach_rate')
              electro_enabled_rate = ready.get('electro_coupling_enabled_rate')
              electro_max_transient = ready.get('electro_max_transient_severity')
              electro_max_nonlinear = ready.get('electro_max_nonlinear_severity')
              electro_max_joule = ready.get('electro_max_joule_heating_scale')
              electro_joule_threshold = ready.get('electro_max_joule_heating_scale_threshold')
              electro_max_spread = ready.get('electro_max_conductivity_spread_ratio')
              electro_spread_threshold = ready.get('electro_max_conductivity_spread_ratio_threshold')
              electro_joule_breach_rate = ready.get('electro_joule_breach_rate')
              electro_spread_breach_rate = ready.get('electro_spread_breach_rate')
              electro_joule_trend_ratio = ready.get('electro_joule_trend_ratio')
              electro_spread_trend_ratio = ready.get('electro_spread_trend_ratio')
              plastic_max_severity = ready.get('plastic_max_nonlinear_severity')
              plastic_severity_threshold = ready.get('plastic_max_nonlinear_severity_threshold')
              plastic_breach_rate = ready.get('plastic_breach_rate')
              plastic_trend_ratio = ready.get('plastic_trend_ratio')
              plastic_reference_trend_ratio = ready.get('plastic_reference_trend_ratio')
              plastic_reference_trend_threshold = ready.get('plastic_reference_max_trend_ratio_threshold')
              contact_max_severity = ready.get('contact_max_nonlinear_severity')
              contact_severity_threshold = ready.get('contact_max_nonlinear_severity_threshold')
              contact_breach_rate = ready.get('contact_breach_rate')
              contact_trend_ratio = ready.get('contact_trend_ratio')
              contact_reference_trend_ratio = ready.get('contact_reference_trend_ratio')
              contact_reference_trend_threshold = ready.get('contact_reference_max_trend_ratio_threshold')
              require_promotion_ready = ready.get('require_promotion_ready')
              plastic_promotion_ready = ready.get('plastic_promotion_ready')
              plastic_promotion_sample_count = ready.get('plastic_promotion_sample_count')
              plastic_promotion_min_samples = ready.get('plastic_promotion_min_samples')
              plastic_promotion_blockers = ready.get('plastic_promotion_blockers')
              plastic_promotion_blocker_count = ready.get('plastic_promotion_blocker_count')
              plastic_promotion_max_blockers = ready.get('plastic_promotion_max_blockers')
              plastic_promotion_blocker_regression = ready.get('plastic_promotion_blocker_regression')
              contact_promotion_ready = ready.get('contact_promotion_ready')
              contact_promotion_sample_count = ready.get('contact_promotion_sample_count')
              contact_promotion_min_samples = ready.get('contact_promotion_min_samples')
              contact_promotion_blockers = ready.get('contact_promotion_blockers')
              contact_promotion_blocker_count = ready.get('contact_promotion_blocker_count')
              contact_promotion_max_blockers = ready.get('contact_promotion_max_blockers')
              contact_promotion_blocker_regression = ready.get('contact_promotion_blocker_regression')
              promotion_max_blocker_regression = ready.get('promotion_max_blocker_regression')
              promotion_calibration_applied = ready.get('promotion_calibration_applied')
              require_promotion_calibration = ready.get('require_promotion_calibration')
              promotion_calibration_age_days = ready.get('promotion_calibration_age_days')
              promotion_calibration_max_age_days = ready.get('promotion_calibration_max_age_days')
              promotion_history_sufficient = ready.get('promotion_history_sufficient')
              promotion_min_rolling_reports = ready.get('promotion_min_rolling_reports')
              reference_trend_ratcheted = ready.get('reference_trend_ratcheted')
              reference_trend_rationale = ready.get('reference_trend_rationale')
              rolling_report_count = ready.get('rolling_report_count')
              lines.append(
                  "- Thermo coupling enabled-rate: "
                  f"{thermo_enabled_rate if thermo_enabled_rate is not None else '-'}"
              )
              lines.append(
                  "- Thermo max transient severity: "
                  f"{thermo_max_transient if thermo_max_transient is not None else '-'}"
              )
              lines.append(
                  "- Thermo max nonlinear severity: "
                  f"{thermo_max_nonlinear if thermo_max_nonlinear is not None else '-'}"
              )
              lines.append(
                  "- Thermo max spread ratio: "
                  f"{thermo_max_spread if thermo_max_spread is not None else '-'}"
              )
              lines.append(
                  "- Thermo spread ratio threshold: "
                  f"{thermo_spread_threshold if thermo_spread_threshold is not None else '-'}"
              )
              if ready.get('governance_profile') == 'feature':
                  lines.append(
                      "- Feature-profile posture: allows thermo spread up to 1.6 to absorb pathological fixture variance"
                  )
              lines.append(
                  "- Thermo max heterogeneity index: "
                  f"{thermo_max_heterogeneity if thermo_max_heterogeneity is not None else '-'}"
              )
              lines.append(
                  "- Thermo min field coverage ratio: "
                  f"{thermo_min_field_coverage if thermo_min_field_coverage is not None else '-'}"
              )
              lines.append(
                  "- Thermo field coverage threshold: "
                  f"{thermo_field_coverage_threshold if thermo_field_coverage_threshold is not None else '-'}"
              )
              lines.append(
                  "- Thermo max field extrapolation ratio: "
                  f"{thermo_max_field_extrapolation if thermo_max_field_extrapolation is not None else '-'}"
              )
              lines.append(
                  "- Thermo field extrapolation threshold: "
                  f"{thermo_field_extrapolation_threshold if thermo_field_extrapolation_threshold is not None else '-'}"
              )
              lines.append(
                  "- Thermo field coverage drop trend ratio: "
                  f"{thermo_field_coverage_drop_trend_ratio if thermo_field_coverage_drop_trend_ratio is not None else '-'}"
              )
              lines.append(
                  "- Thermo field coverage drop trend threshold: "
                  f"{thermo_field_coverage_drop_trend_threshold if thermo_field_coverage_drop_trend_threshold is not None else '-'}"
              )
              lines.append(
                  "- Thermo field extrapolation trend ratio: "
                  f"{thermo_field_extrapolation_trend_ratio if thermo_field_extrapolation_trend_ratio is not None else '-'}"
              )
              lines.append(
                  "- Thermo field extrapolation trend threshold: "
                  f"{thermo_field_extrapolation_trend_threshold if thermo_field_extrapolation_trend_threshold is not None else '-'}"
              )
              lines.append(
                  "- Thermo spread breach rate: "
                  f"{thermo_spread_breach_rate if thermo_spread_breach_rate is not None else '-'}"
              )
              lines.append(
                  "- Thermo heterogeneity breach rate: "
                  f"{thermo_heterogeneity_breach_rate if thermo_heterogeneity_breach_rate is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal coupling enabled-rate: "
                  f"{electro_enabled_rate if electro_enabled_rate is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal max transient severity: "
                  f"{electro_max_transient if electro_max_transient is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal max nonlinear severity: "
                  f"{electro_max_nonlinear if electro_max_nonlinear is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal max Joule heating scale: "
                  f"{electro_max_joule if electro_max_joule is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal Joule threshold: "
                  f"{electro_joule_threshold if electro_joule_threshold is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal max conductivity spread ratio: "
                  f"{electro_max_spread if electro_max_spread is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal spread threshold: "
                  f"{electro_spread_threshold if electro_spread_threshold is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal Joule breach rate: "
                  f"{electro_joule_breach_rate if electro_joule_breach_rate is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal spread breach rate: "
                  f"{electro_spread_breach_rate if electro_spread_breach_rate is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal Joule trend ratio: "
                  f"{electro_joule_trend_ratio if electro_joule_trend_ratio is not None else '-'}"
              )
              lines.append(
                  "- Electro-thermal spread trend ratio: "
                  f"{electro_spread_trend_ratio if electro_spread_trend_ratio is not None else '-'}"
              )
              lines.append(
                  "- Plastic max nonlinear severity: "
                  f"{plastic_max_severity if plastic_max_severity is not None else '-'}"
              )
              lines.append(
                  "- Plastic severity threshold: "
                  f"{plastic_severity_threshold if plastic_severity_threshold is not None else '-'}"
              )
              lines.append(
                  "- Plastic breach rate: "
                  f"{plastic_breach_rate if plastic_breach_rate is not None else '-'}"
              )
              lines.append(
                  "- Plastic trend ratio: "
                  f"{plastic_trend_ratio if plastic_trend_ratio is not None else '-'}"
              )
              lines.append(
                  "- Plastic reference trend ratio: "
                  f"{plastic_reference_trend_ratio if plastic_reference_trend_ratio is not None else '-'}"
              )
              lines.append(
                  "- Plastic reference trend threshold: "
                  f"{plastic_reference_trend_threshold if plastic_reference_trend_threshold is not None else '-'}"
              )
              lines.append(
                  "- Contact max nonlinear severity: "
                  f"{contact_max_severity if contact_max_severity is not None else '-'}"
              )
              lines.append(
                  "- Contact severity threshold: "
                  f"{contact_severity_threshold if contact_severity_threshold is not None else '-'}"
              )
              lines.append(
                  "- Contact breach rate: "
                  f"{contact_breach_rate if contact_breach_rate is not None else '-'}"
              )
              lines.append(
                  "- Contact trend ratio: "
                  f"{contact_trend_ratio if contact_trend_ratio is not None else '-'}"
              )
              lines.append(
                  "- Contact reference trend ratio: "
                  f"{contact_reference_trend_ratio if contact_reference_trend_ratio is not None else '-'}"
              )
              lines.append(
                  "- Contact reference trend threshold: "
                  f"{contact_reference_trend_threshold if contact_reference_trend_threshold is not None else '-'}"
              )
              lines.append(
                  "- Promotion-ready required: "
                  f"{require_promotion_ready if require_promotion_ready is not None else '-'}"
              )
              lines.append(
                  "- Plastic promotion ready: "
                  f"{plastic_promotion_ready if plastic_promotion_ready is not None else '-'}"
              )
              lines.append(
                  "- Plastic promotion samples/min: "
                  f"{plastic_promotion_sample_count if plastic_promotion_sample_count is not None else '-'}/{plastic_promotion_min_samples if plastic_promotion_min_samples is not None else '-'}"
              )
              lines.append(
                  "- Plastic promotion blockers: "
                  f"{', '.join(plastic_promotion_blockers) if isinstance(plastic_promotion_blockers, list) and plastic_promotion_blockers else '-'}"
              )
              lines.append(
                  "- Plastic blocker count/max: "
                  f"{plastic_promotion_blocker_count if plastic_promotion_blocker_count is not None else '-'}/{plastic_promotion_max_blockers if plastic_promotion_max_blockers is not None else '-'}"
              )
              lines.append(
                  "- Plastic blocker regression/allowed: "
                  f"{plastic_promotion_blocker_regression if plastic_promotion_blocker_regression is not None else '-'}/{promotion_max_blocker_regression if promotion_max_blocker_regression is not None else '-'}"
              )
              lines.append(
                  "- Contact promotion ready: "
                  f"{contact_promotion_ready if contact_promotion_ready is not None else '-'}"
              )
              lines.append(
                  "- Contact promotion samples/min: "
                  f"{contact_promotion_sample_count if contact_promotion_sample_count is not None else '-'}/{contact_promotion_min_samples if contact_promotion_min_samples is not None else '-'}"
              )
              lines.append(
                  "- Contact promotion blockers: "
                  f"{', '.join(contact_promotion_blockers) if isinstance(contact_promotion_blockers, list) and contact_promotion_blockers else '-'}"
              )
              lines.append(
                  "- Contact blocker count/max: "
                  f"{contact_promotion_blocker_count if contact_promotion_blocker_count is not None else '-'}/{contact_promotion_max_blockers if contact_promotion_max_blockers is not None else '-'}"
              )
              lines.append(
                  "- Contact blocker regression/allowed: "
                  f"{contact_promotion_blocker_regression if contact_promotion_blocker_regression is not None else '-'}/{promotion_max_blocker_regression if promotion_max_blocker_regression is not None else '-'}"
              )
              lines.append(
                  "- Promotion calibration applied/required: "
                  f"{promotion_calibration_applied if promotion_calibration_applied is not None else '-'}/{require_promotion_calibration if require_promotion_calibration is not None else '-'}"
              )
              lines.append(
                  "- Promotion calibration age/max days: "
                  f"{promotion_calibration_age_days if promotion_calibration_age_days is not None else '-'}/{promotion_calibration_max_age_days if promotion_calibration_max_age_days is not None else '-'}"
              )
              lines.append(
                  "- Promotion history sufficient: "
                  f"{promotion_history_sufficient if promotion_history_sufficient is not None else '-'} (rolling={rolling_report_count if rolling_report_count is not None else '-'}, min={promotion_min_rolling_reports if promotion_min_rolling_reports is not None else '-'})"
              )
              lines.append(
                  "- Reference trend ratchet active: "
                  f"{reference_trend_ratcheted if reference_trend_ratcheted is not None else '-'}"
              )
              lines.append(
                  "- Reference trend ratchet basis: "
                  f"{reference_trend_rationale if reference_trend_rationale is not None else '-'}"
              )
              lines.append(
                  "- Rolling report count used for ratchet: "
                  f"{rolling_report_count if rolling_report_count is not None else '-'}"
              )
              if ratchet_path.exists():
                  ratchet = json.loads(ratchet_path.read_text())
                  lines.append(
                      "- Ratchet entries: "
                      f"{len(ratchet.get('entries', []))}"
                  )
              else:
                  lines.append("- Ratchet report: missing")
              lines.append(
                  "- Promotion calibration artifact: "
                  f"{'present' if promotion_calib_path.exists() else 'missing'}"
              )
              lines.append(
                  "- External reference benchmark artifact: "
                  f"{'present' if external_ref_path.exists() else 'missing'}"
              )
          else:
              lines.append("- Readiness artifact: missing")
          out = Path("tier75-governance-summary.md")
          out.write_text("\n".join(lines) + "\n")
          print(out.read_text())
          PY
          cat tier75-governance-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FEA conformance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fea-conformance-${{ github.run_id }}
          path: |
            target/runmat-analysis-artifacts/analysis_benchmark_report.json
            target/runmat-analysis-artifacts/fea_release_readiness.json
            target/runmat-analysis-artifacts/threshold_ratchet_report.json
            target/runmat-analysis-artifacts/threshold_ratchet_report.md
            target/runmat-analysis-artifacts/promotion_threshold_calibration.json
            target/runmat-analysis-artifacts/external_reference_benchmark.json
            target/runmat-analysis-artifacts/rolling/*.json
            fea-conformance-summary.md
            fea-release-readiness.md
            nonlinear-trends.md
            tier75-governance-summary.md
          if-no-files-found: warn
