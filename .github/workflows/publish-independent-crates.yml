name: Publish independent frozen crates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-crates-v0.7.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SOURCE: aec79e0e5c70ce70f1363089268f1eeb92748503
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check publication planner and retry controls
        run: node --test scripts/distribution/independent-crates.test.mjs scripts/publish-crates.test.mjs
      - name: Require original publisher to be stopped
        run: |
          gh api 'repos/runmat-org/runmat/actions/runs/43410453346/jobs?filter=latest&per_page=100' \
            --jq '[.jobs[] | select(.name == "Publish crates to crates.io")] | if length == 1 and .[0].status == "completed" then .[0].conclusion else error("Original publisher is missing or still active") end'
      - name: Checkout frozen release source
        uses: actions/checkout@v5
        with:
          ref: v0.7.1
          path: frozen-source
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Recheck qualified source and versions
        working-directory: frozen-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          node scripts/verify-release-version.mjs 0.7.1
          node scripts/distribution/release-ci-checkpoint.mjs
      - name: Include release license files
        working-directory: frozen-source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r toml; do
            d="${toml%/*}"
            if [ "$d" = "crates/runmat-clarabel" ]; then
              grep -Eq '^license[[:space:]]*=[[:space:]]*"Apache-2.0"' "$toml"
              cmp "$d/LICENSE.md" crates/runmat-runtime/licenses/CLARABEL-LICENSE.txt
              continue
            fi
            cp LICENSE.md "$d/LICENSE"
            cp FREE-USE.md "$d/FREE-USE.md"
            if grep -Eq '^license-file[[:space:]]*=[[:space:]]*"\..*/LICENSE' "$toml"; then
              sed -E -i.bak 's#^license-file[[:space:]]*=[[:space:]]*"\..*/LICENSE.*#license-file = "LICENSE"#' "$toml"
              rm -f "$toml.bak"
            fi
          done < <(find crates -mindepth 2 -maxdepth 4 -name Cargo.toml | sort)
      - name: Publish only independent dependency-complete crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          node scripts/distribution/independent-crates.mjs \
            "$GITHUB_WORKSPACE/frozen-source" "$RELEASE_SOURCE" v0.7.1 \
            "$RUNNER_TEMP/independent-crates.json"
      - name: Retain exact partial publication inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-crates-${{ github.run_id }}
          path: ${{ runner.temp }}/independent-crates.json
          if-no-files-found: warn
          retention-days: 30
