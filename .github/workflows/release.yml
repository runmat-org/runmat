name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: true
        default: main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VERSION: ${{ github.ref_name }}

jobs:
  validate-release-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify tag matches reviewed package versions
        if: github.event_name == 'push'
        shell: bash
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Record workflow-dispatch source
        if: github.event_name == 'workflow_dispatch'
        run: echo "Testing ${{ inputs.ref }} without publishing a release."

  release-validation:
    name: Validate release with CI
    needs: [validate-release-state]
    uses: ./.github/workflows/ci.yml
    with:
      release_validation: true

  build-release:
    if: github.event_name == 'push'
    needs: [validate-release-state]
    environment: Production
    name: Build ${{ matrix.platform.release_for }}
    env:
      RUNMAT_TELEMETRY_KEY: ${{ secrets.TELEMETRY_INGESTION_KEY }}
    strategy:
      max-parallel: 8
      matrix:
        platform:
          
          - release_for: windows-x86_64
            os: warp-windows-latest-x64-8x
            target: x86_64-pc-windows-msvc
            bin: runmat.exe
            name: runmat-windows-x86_64.zip
            command: build

          - release_for: macos-x86_64
            os: warp-macos-26-arm64-12x
            target: x86_64-apple-darwin
            bin: runmat
            name: runmat-darwin-x86_64.tar.gz
            command: build

          - release_for: macos-aarch64
            os: warp-macos-26-arm64-12x
            target: aarch64-apple-darwin
            bin: runmat
            name: runmat-darwin-aarch64.tar.gz
            command: build

          - release_for: linux-x86_64
            os: warp-ubuntu-latest-x64-16x
            target: x86_64-unknown-linux-gnu
            bin: runmat
            name: runmat-linux-x86_64.tar.gz
            command: build

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libhdf5-dev libopenblas-dev liblapack-dev libzmq3-dev pkg-config libssl-dev

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: bash scripts/ci-install-macos-cross-dependencies.sh "${{ matrix.platform.target }}"

      - name: Install Rust release target
        shell: bash
        run: rustup target add "${{ matrix.platform.target }}"

      - name: Restore native artifact build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-artifact-v1-${{ matrix.platform.target }}
          cache-workspace-crates: true

      - name: Restore Windows native dependency cache
        if: runner.os == 'Windows' && matrix.platform.target != 'aarch64-pc-windows-gnu'
        uses: actions/cache@v5
        with:
          path: ~/vcpkg-runmat/installed
          key: windows-vcpkg-a7eda31-${{ matrix.platform.target }}-${{ hashFiles('infra/vcpkg-ports/**', 'infra/scripts/ensure-windows-vcpkg-dependencies.ps1', 'infra/scripts/prepare-windows-cross-dependencies.ps1') }}

      - name: Install Windows MSVC native dependencies
        if: runner.os == 'Windows' && matrix.platform.target != 'aarch64-pc-windows-gnu'
        shell: pwsh
        run: ./infra/scripts/prepare-windows-cross-dependencies.ps1 -Target "${{ matrix.platform.target }}"

      - name: Build release CLI with embedded AOT runtime (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          OPENSSL_NO_PKG_CONFIG: ${{ runner.os == 'macOS' && '1' || '0' }}
          OPENSSL_STATIC: ${{ runner.os == 'macOS' && '1' || '0' }}
          RUNMAT_BUILD_TARGET: ${{ matrix.platform.target }}
          RUNMAT_OCCT_LINK_MODE: static
        run: |
          set -euo pipefail
          features="blas-lapack,occt-native"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            features="$features,vendored-openssl"
          fi
          bash scripts/build-runmat-with-aot-runtime.sh \
            --locked --release --target "${{ matrix.platform.target }}" \
            --bin runmat --features "$features"

      - name: Build release CLI with embedded AOT runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          OPENSSL_NO_PKG_CONFIG: '1'
          OPENSSL_STATIC: '1'
          RUNMAT_BUILD_TARGET: ${{ matrix.platform.target }}
          RUNMAT_OCCT_LINK_MODE: dylib
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/build-runmat-with-aot-runtime.ps1 --locked --release --target "${{ matrix.platform.target }}" --bin runmat --features "blas-lapack,vendored-openssl,occt-native"
          if ($LASTEXITCODE -ne 0) { throw "embedded-runtime release build failed with exit code $LASTEXITCODE" }

      - name: Verify packaged CLI contains the native compile runtime (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/verify-runmat-with-aot-runtime.sh "target/${{ matrix.platform.target }}/release/runmat"

      - name: Verify packaged CLI contains the native compile runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-runmat-with-aot-runtime.ps1 -RunMatBinary "target/${{ matrix.platform.target }}/release/runmat.exe"

      - name: Sign and notarize release artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_NOTARIZE_KEY_ID: ${{ secrets.APPLE_NOTARIZE_KEY_ID }}
          APPLE_NOTARIZE_ISSUER_ID: ${{ secrets.APPLE_NOTARIZE_ISSUER_ID }}
          APPLE_NOTARIZE_PRIVATE_KEY: ${{ secrets.APPLE_NOTARIZE_PRIVATE_KEY }}
        run: bash scripts/sign-and-notarize-macos-binary.sh "target/${{ matrix.platform.target }}/release/runmat"

      - name: Package as archive (Windows)
        if: runner.os == 'Windows' && matrix.platform.target != 'aarch64-pc-windows-gnu'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = "${{ matrix.platform.target }}"
          $outDir = Join-Path "target" (Join-Path $target "release")
          $artifactName = "runmat-${{ env.VERSION }}-${{ matrix.platform.release_for }}"

          Push-Location $outDir
          # Copy required runtime DLLs into output dir
          $triplet = $env:VCPKG_DEFAULT_TRIPLET
          $vcpkgBin = Join-Path $env:VCPKG_ROOT ("installed\" + $triplet + "\bin")
          if (Test-Path $vcpkgBin) { Copy-Item -Path (Join-Path $vcpkgBin "*.dll") -Destination . -Force -ErrorAction SilentlyContinue }

          $zmqBin = Join-Path $env:ZMQ_PATH "bin"
          if (Test-Path $zmqBin) { Copy-Item -Path (Join-Path $zmqBin "*.dll") -Destination . -Force -ErrorAction SilentlyContinue }
          else {
            $zmqLib = Join-Path $env:ZMQ_PATH "lib"
            if (Test-Path $zmqLib) { Copy-Item -Path (Join-Path $zmqLib "*.dll") -Destination . -Force -ErrorAction SilentlyContinue }
          }

          # Create zip with binary and DLLs
          7z a (Join-Path "..\..\.." ("$artifactName.zip")) ${{ matrix.platform.bin }} *.dll
          Pop-Location

      - name: Package as archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          ARTIFACT_NAME="runmat-${{ env.VERSION }}-${{ matrix.platform.release_for }}"
          tar czvf ../../../${ARTIFACT_NAME}.tar.gz ${{ matrix.platform.bin }}
          cd -

      - name: Publish release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: runmat-${{ env.VERSION }}-${{ matrix.platform.release_for }}
          path: |
            runmat-*.tar.gz
            runmat-*.zip

  create-release:
    if: github.event_name == 'push'
    name: Create Release
    needs: [release-validation, build-release]
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: RunMat ${{ github.ref_name }}
          body: |
            ## RunMat ${{ github.ref_name }}
            
            High-performance MATLAB/Octave runtime with Jupyter kernel support.
            
            ### Installation
            
            #### Quick Install (Recommended)
            ```bash
            # Linux/macOS
            curl -fsSL https://runmat.com/install.sh | sh
            
            # Windows (PowerShell)
            iwr https://runmat.com/install.ps1 | iex
            ```
            
            #### Manual Installation
            1. Download the appropriate binary for your platform below
            2. Extract the archive
            3. Add the binary to your PATH
            
            ### Documentation
            - [Getting Started](https://runmat.com/docs/getting-started)
          files: |
            artifacts/**/*
          draft: false
          prerelease: false

  publish-crates:
    if: github.event_name == 'push'
    name: Publish crates to crates.io
    needs: [create-release]
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Ensure LICENSE is included in each crate
        shell: bash
        run: |
          set -euxo pipefail
          while IFS= read -r toml; do
            d="${toml%/*}"
            if [ -f LICENSE ] || [ -f LICENSE.md ]; then
              cp -f LICENSE* "$d/" || true
              if [ -f "$d/LICENSE.md" ]; then mv -f "$d/LICENSE.md" "$d/LICENSE"; fi
            fi
          done < <(find crates -mindepth 2 -maxdepth 4 -name Cargo.toml | sort)

      - name: Normalize Cargo.toml license metadata
        shell: bash
        run: |
          set -euxo pipefail
          while IFS= read -r toml; do
            if grep -Eq '^license-file[[:space:]]*=[[:space:]]*"\..*/LICENSE' "$toml"; then
              sed -E -i.bak 's#^license-file[[:space:]]*=[[:space:]]*"\..*/LICENSE.*#license-file = "LICENSE"#' "$toml"
              rm -f "$toml.bak"
            fi
            if ! grep -Eq '^license[[:space:]]*=' "$toml" && [ -f "${toml%/*}/LICENSE" ]; then
              awk 'BEGIN{printed=0} {print} /^\[package\]/{if(!printed){print "license = \"MIT\""; printed=1}}' "$toml" > "$toml.tmp" && mv "$toml.tmp" "$toml"
            fi
          done < <(find crates -mindepth 2 -maxdepth 4 -name Cargo.toml | sort)

      - name: Verify published crate assets
        shell: bash
        run: |
          set -euxo pipefail
          cmp openapi/runmat-public.yaml crates/runmat-server-client/openapi/runmat-public.yaml
          cargo package -p runmat-server-client --allow-dirty --list | tee /tmp/runmat-server-client-package.txt
          grep -Fx 'openapi/runmat-public.yaml' /tmp/runmat-server-client-package.txt

      - name: Publish crates with cargo-workspaces
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euxo pipefail
          cargo install cargo-workspaces --locked
          cargo workspaces publish \
            --all \
            --yes \
            --allow-dirty \
            --skip-published \
            --publish-as-is \
            --publish-interval 30 \
            --no-verify \
            --token "$CARGO_REGISTRY_TOKEN"

  publish-bindings:
    if: github.event_name == 'push'
    name: Publish wasm bindings to npm
    needs: [publish-crates]
    uses: ./.github/workflows/wasm-bindings.yml
    secrets: inherit
    with:
      ref: ${{ github.ref_name }}
      release_channel: prod
      version: ${{ github.ref_name }}
      publish: true
