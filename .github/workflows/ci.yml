name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source ref selected by the calling release workflow
        type: string
        default: ''
      release_validation:
        description: Run validation lanes when CI is called from the Release workflow
        type: boolean
        default: false
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scientific-receipts:
    name: Verify committed scientific qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/qualification/scientific.py verify

  distribution-contracts:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify distribution staging and notice archives
        run: >-
          node --test
          scripts/distribution/third-party-notices.test.cjs
          bindings/ts/scripts/sync-wasm-artifacts.test.cjs
          scripts/runtime/builtin-example-verifier/protocol.test.mjs
          scripts/development/check-reviewed-architecture.test.mjs
          scripts/development/verify-fea-lint-debt.test.mjs
          infra/scripts/bootstrap-vcpkg-tool.test.mjs
          infra/scripts/native-build-cache-key.test.mjs

      - name: Verify ordinary test routing and shard coverage
        run: python3 -m unittest discover -s scripts/development -p 'test_run_workspace_test_group.py'

  build-and-test:
    name: ${{ matrix.name }}
    # Run on pushes for all branches, and only on PRs from forks to avoid double CI on same-repo PRs
    if: inputs.release_validation || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - runner: warp-ubuntu-latest-x64-16x
            name: linux-quality
            task: quality
            needs_occt: true
          - runner: warp-ubuntu-latest-x64-16x
            name: linux-tests-language
            task: test
            test_group: language
            needs_occt: false
          - runner: warp-ubuntu-latest-x64-16x
            name: linux-tests-runtime
            task: test
            test_group: runtime
            needs_occt: true
          - runner: warp-ubuntu-latest-x64-16x
            name: linux-tests-geometry-analysis
            task: test
            test_group: geometry-analysis
            needs_occt: true
          - runner: warp-ubuntu-latest-x64-16x
            name: linux-tests-tooling-distributed
            task: test
            test_group: tooling-distributed
            needs_occt: true
          - runner: warp-macos-26-arm64-12x
            name: macos-tests-language
            task: test
            test_group: language
            needs_occt: false
          - runner: warp-macos-26-arm64-12x
            name: macos-tests-runtime
            task: test
            test_group: runtime
            needs_occt: false
          - runner: warp-macos-26-arm64-12x
            name: macos-tests-geometry-analysis
            task: test
            test_group: geometry-analysis
            needs_occt: false
          - runner: warp-macos-26-arm64-12x
            name: macos-tests-tooling-distributed
            task: test
            test_group: tooling-distributed
            needs_occt: false
          - runner: warp-windows-latest-x64-8x
            name: windows-quality
            task: quality
            needs_occt: true
          - runner: warp-windows-latest-x64-8x
            name: windows-tests-language
            task: test
            test_group: language
            needs_occt: false
          - runner: warp-windows-latest-x64-16x
            name: windows-tests-runtime
            task: test
            test_group: runtime
            needs_occt: true
          - runner: warp-windows-latest-x64-8x
            name: windows-tests-geometry-analysis
            task: test
            test_group: geometry-analysis
            needs_occt: true
          - runner: warp-windows-latest-x64-16x
            name: windows-tests-tooling-distributed
            task: test
            test_group: tooling-distributed
            needs_occt: true
            # Disjoint root batches bound disk use; both retain the original
            # package/feature union and restore the same compiled libraries.
            shard_index: 0
            shard_count: 2
            cache_name: windows-tests-tooling-distributed
          - runner: warp-windows-latest-x64-16x
            name: windows-tests-tooling-distributed-tail
            task: test
            test_group: tooling-distributed
            needs_occt: true
            shard_index: 1
            shard_count: 2
            cache_name: windows-tests-tooling-distributed
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ startsWith(matrix.name, 'windows-tests-') && 480 || 360 }}
    env:
      # Enable backtraces on CI to aid debugging of panics/segfaults
      RUST_BACKTRACE: 1
      MATRIX_NAME: ${{ matrix.name }}
      # The all-feature workspace produces large native objects. Keep ephemeral
      # compiler state and DWARF from exhausting hosted and self-hosted runners.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Each Builtins compiler can retain 24 GiB. Heavy Windows lanes have
      # 64 GiB for two compilers; 28-GiB Mac workers compile one at a time.
      # Linux's 16-core lane has more memory for parallel compilation.
      # All-target quality checks can type-check several large roots together.
      CARGO_BUILD_JOBS: ${{ matrix.task == 'quality' && '2' || startsWith(matrix.name, 'windows-') && '2' || startsWith(matrix.name, 'macos-') && '1' || '8' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: ${{ matrix.task == 'quality' && '0' || '1' }}

      - name: Isolate Cargo build artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Every matrix job owns its runner and checkout. Use the cache
          # action's default workspace target path for its retained libraries.
          target_dir="${GITHUB_WORKSPACE}/target"
          echo "CARGO_TARGET_DIR=${target_dir}" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - name: Bound Windows test linker artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'CARGO_PROFILE_DEV_SPLIT_DEBUGINFO=off' >> $env:GITHUB_ENV
          'CARGO_PROFILE_TEST_SPLIT_DEBUGINFO=off' >> $env:GITHUB_ENV
          '_LINK_=/DEBUG:NONE' >> $env:GITHUB_ENV

      - name: Prepare bounded Windows build storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $storage = & ./infra/scripts/prepare-windows-build-storage.ps1 `
            -TargetDirectory $env:CARGO_TARGET_DIR `
            -ScratchDirectory "$env:RUNNER_TEMP/runmat-build-scratch" `
            -ReclaimUnusedRunnerTools
          "TMP=$($storage.ScratchDirectory)" >> $env:GITHUB_ENV
          "TEMP=$($storage.ScratchDirectory)" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          # Completed root test binaries are reclaimed after each batch.
          # Keep the remaining libraries at a stable, lane-specific path.
          shared-key: ordinary-0.7-v1-${{ matrix.cache_name || matrix.name }}
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake build-essential ca-certificates cmake curl \
            gdb git libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev libhdf5-dev \
            liblapack-dev libopenblas-dev libssl-dev libtool libudev-dev libvulkan1 mesa-vulkan-drivers libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxrandr-dev libzmq3-dev ninja-build pkg-config unzip zip \
            xauth xvfb

      - name: Restore pinned Linux OpenCASCADE
        if: runner.os == 'Linux' && matrix.needs_occt
        uses: actions/cache@v5
        with:
          path: ~/vcpkg-runmat
          key: linux-${{ runner.arch }}-vcpkg-occt-2026.06.01-${{ hashFiles('infra/scripts/ensure-linux-vcpkg-occt.sh', 'infra/vcpkg-linux-ports/**') }}
          restore-keys: linux-${{ runner.arch }}-vcpkg-occt-2026.06.01-

      - name: Ensure pinned Linux OpenCASCADE (vcpkg)
        if: runner.os == 'Linux' && matrix.needs_occt
        shell: bash
        env:
          RUNMAT_VCPKG_REF: 2026.06.01
          RUNMAT_VCPKG_TRIPLET: x64-linux-runmat-dynamic-release
          GH_TOKEN: ${{ github.token }}
        run: infra/scripts/ensure-linux-vcpkg-occt.sh

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew update
          brew install hdf5 zeromq

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python interoperability test dependencies
        shell: bash
        run: |
          python -m pip install 'numpy>=2,<3'
          python -c "import sys, numpy; print(sys.executable); print(numpy.__version__)"

      - name: Restore Windows native dependency cache
        if: runner.os == 'Windows' && matrix.needs_occt
        uses: actions/cache@v5
        with:
          path: ~/vcpkg-runmat/installed
          key: windows-vcpkg-a7eda31-x86_64-pc-windows-msvc-${{ hashFiles('infra/vcpkg-ports/**', 'infra/scripts/ensure-windows-vcpkg-dependencies.ps1', 'infra/scripts/prepare-windows-cross-dependencies.ps1') }}

      - name: Install Windows MSVC native dependencies
        if: runner.os == 'Windows' && matrix.needs_occt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./infra/scripts/prepare-windows-cross-dependencies.ps1 -Target x86_64-pc-windows-msvc

      - name: Enable Windows compiler for native interoperability tests
        if: runner.os == 'Windows' && matrix.task == 'test'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (!$installation) { throw 'Visual Studio C++ tools are required by native interoperability tests' }
          $devCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $command = '"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $devCmd
          $environment = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio developer environment failed' }
          foreach ($line in $environment) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Install pinned shader compiler beside Windows test executables
        if: runner.os == 'Windows' && matrix.task == 'test' && matrix.test_group != 'language'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dxc = & ./scripts/distribution/prepare-windows-dxc-runtime.ps1 -Target x86_64-pc-windows-msvc -Destination "$env:RUNNER_TEMP/runmat-test-dxc"
          foreach ($directory in @("$env:CARGO_TARGET_DIR/debug", "$env:CARGO_TARGET_DIR/debug/deps", "$env:CARGO_TARGET_DIR/debug/examples")) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            Copy-Item -LiteralPath (Join-Path $dxc.BinDir 'dxcompiler.dll'),(Join-Path $dxc.BinDir 'dxil.dll') -Destination $directory
          }

      - name: Select native Perl for Windows quality builds
        if: matrix.name == 'windows-quality'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl)) { throw 'Strawberry Perl was not installed' }
          & $perl -MLocale::Maketext::Simple -MIPC::Cmd -e 1
          if ($LASTEXITCODE -ne 0) { throw 'Native Perl lacks the OpenSSL build modules' }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV

      - name: Format
        if: matrix.task == 'quality' && runner.os != 'Windows'
        run: cargo fmt -- --check

      - name: Validate crate architecture boundaries
        if: matrix.task == 'quality' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          scripts/development/check-architecture-boundaries.sh 2>&1 | tee architecture-boundaries.log

      - name: Verify ordinary test routing and target batching
        if: matrix.name == 'linux-quality'
        run: python -m unittest discover -s scripts/development -p 'test_run_workspace_test_group.py'

      - name: Retain architecture boundary diagnostics
        if: always() && matrix.task == 'quality' && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: architecture-boundaries-${{ matrix.name }}
          path: architecture-boundaries.log
          if-no-files-found: warn

      - name: Validate public FEA field ids
        if: matrix.task == 'quality' && runner.os != 'Windows'
        run: python3 scripts/fea/governance/validate_public_field_ids.py

      - name: Validate immutable meshing corpus
        if: matrix.name == 'linux-quality'
        run: python3 scripts/meshing/validate_corpus.py

      - name: Validate difficult-geometry meshing conformance
        if: matrix.name == 'linux-quality'
        run: python3 scripts/meshing/validate_conformance.py

      - name: Validate independent-mesher differential evidence
        if: matrix.name == 'linux-quality'
        run: python3 scripts/meshing/validate_differential.py

      - name: Validate meshing budget and reliability coverage
        if: matrix.name == 'linux-quality'
        run: python3 scripts/meshing/validate_reliability.py

      - name: Validate mandatory meshing release evidence
        if: matrix.name == 'linux-quality'
        run: python3 scripts/meshing/validate_release_evidence.py

      - name: Test meshing governance
        if: matrix.name == 'linux-quality'
        run: python3 -m unittest discover -s scripts/meshing/tests -p 'test_*.py'

      - name: Clippy
        if: matrix.task == 'quality'
        # Strict workspace lints apply to first-party crates. Clarabel retains
        # upstream source and optional external integrations; its pure-Rust
        # profiles are compiled below and exercised by the runtime test group.
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --exclude runmat-clarabel --exclude runmat-analysis-fea --all-targets --all-features --keep-going --no-deps -- -D warnings

      - name: Verify reviewed FEA lint debt
        if: ${{ success() && !cancelled() && matrix.task == 'quality' }}
        shell: bash
        run: |
          set -euo pipefail
          rustc --version | grep -Eq '^rustc 1\.90\.0 '
          set +e
          cargo clippy -p runmat-analysis-fea --all-targets --all-features --keep-going --no-deps --message-format=json -- -D warnings > fea-lint-debt.jsonl 2> fea-lint-debt.log
          status=$?
          set -e
          cat fea-lint-debt.log
          node scripts/development/verify-fea-lint-debt.mjs fea-lint-debt.jsonl "$status"

      - name: Retain FEA lint diagnostics
        if: always() && matrix.task == 'quality'
        uses: actions/upload-artifact@v4
        with:
          name: fea-lint-debt-${{ matrix.name }}
          path: |
            fea-lint-debt.log
            fea-lint-debt.jsonl
          if-no-files-found: warn


      - name: Check
        if: matrix.task == 'quality'
        run: |
          cargo check --workspace --exclude runmat-clarabel --all-targets --all-features --keep-going
          cargo check -p runmat-clarabel --all-targets --no-default-features --keep-going
          cargo check -p runmat-clarabel --all-targets --no-default-features --features serde --keep-going
      - name: Test (Linux)
        if: matrix.task == 'test' && runner.os == 'Linux'
        env:
          RUST_BACKTRACE: 1
          RUST_TEST_THREADS: 1
          # The headless runner provides Mesa Vulkan. Avoid initializing EGL
          # against Xvfb, whose DRI warnings pollute captured child stderr.
          WGPU_BACKEND: vulkan
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            python3 scripts/development/run-workspace-test-group.py "${{ matrix.test_group }}" --reclaim-completed-test-binaries 2>&1 | tee test.log

      - name: Validate current builtin example metadata and plan
        if: matrix.name == 'linux-tests-language'
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the language lane's complete package/feature graph. Selecting
          # only the exporter would create a second dependency feature graph.
          python3 -c '
          import runpy, subprocess
          groups = runpy.run_path("scripts/development/run-workspace-test-group.py")["GROUPS"]
          packages = [argument for package in groups["language"] for argument in ("--package", package)]
          subprocess.run(["cargo", "build", "--all-features", *packages, "--bin", "export_builtin_documentation"], check=True)
          '
          export RUNMAT_EXAMPLE_DOCUMENTATION_BINARY="${CARGO_TARGET_DIR}/debug/export_builtin_documentation"
          root="${RUNNER_TEMP}/builtin-example-metadata"
          mkdir -p "$root"
          node scripts/runtime/verify-builtin-examples.mjs inventory --output "$root/inventory.json"
          node scripts/runtime/verify-builtin-examples.mjs plan \
            --inventory "$root/inventory.json" --product public-products \
            --topology scripts/runtime/builtin-example-topology.c00.json --output "$root/plan.json"

      - name: Test (macOS)
        if: matrix.task == 'test' && runner.os == 'macOS'
        env:
          RUST_BACKTRACE: 1
          RUST_TEST_THREADS: 1
        run: |
          set -o pipefail
          python3 scripts/development/run-workspace-test-group.py "${{ matrix.test_group }}" --reclaim-completed-test-binaries 2>&1 | tee test.log

      - name: Isolate GPU sequence regression before Windows Runtime tests
        if: matrix.name == 'windows-tests-runtime'
        shell: python
        env:
          RUST_BACKTRACE: 1
          RUST_TEST_THREADS: 1
        run: |
          from pathlib import Path
          import runpy

          driver = runpy.run_path('scripts/development/run-workspace-test-group.py')
          root = Path.cwd()
          metadata = driver['workspace_metadata'](root)
          command = driver['test_commands']('runtime', False, metadata)[0]
          assert '--lib' in command
          separator = command.index('--') if '--' in command else len(command)
          command.insert(separator, 'builtins::array::creation::logspace::tests::logspace_wgpu_matches_cpu')
          if '--' not in command:
              command.append('--')
          command.extend(['--exact', '--nocapture'])
          # Preserve the normal package/feature union and retain these binaries
          # for the full cohort. This adds no second compiler configuration.
          with driver['test_runtime_environment']() as environment:
              raise SystemExit(driver['run_batch'](command, root, Path(metadata['target_directory']), False, environment))

      - name: Test (Windows)
        if: matrix.task == 'test' && runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_BACKTRACE: 1
          RUST_TEST_THREADS: 1
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/development/run-workspace-test-group.py "${{ matrix.test_group }}" --shard-index "${{ matrix.shard_index || 0 }}" --shard-count "${{ matrix.shard_count || 1 }}" --reclaim-completed-test-binaries 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Upload analysis benchmark artifacts
        if: always() && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/'))) || (github.event_name == 'pull_request' && failure()))
        uses: actions/upload-artifact@v7
        with:
          name: analysis-benchmark-${{ matrix.name }}
          path: target/runmat-analysis-artifacts/*.json
          if-no-files-found: warn

      - name: Test Summary
        if: always() && github.event_name == 'pull_request' && hashFiles('test.log') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('test.log', 'utf8');
            const matrixName = process.env.MATRIX_NAME || 'matrix';
            let totalPassed = 0;
            let totalFailed = 0;
            let current = '';
            const details = [];
            for (const line of log.split('\n')) {
              const run = line.match(/Running .*deps\/(.+?)-[a-f0-9]+\)/);
              if (run) current = run[1];
              const m = line.match(/test result: .*?(\d+) passed; (\d+) failed.*finished in ([0-9.]+)s/);
              if (m) {
                const passed = parseInt(m[1], 10);
                const failed = parseInt(m[2], 10);
                totalPassed += passed;
                totalFailed += failed;
                details.push(`- ${matrixName} / ${current || 'crate'}: ${passed} passed, ${failed} failed (${m[3]}s)`);
                current = '';
              }
            }
            let body = '**Test Summary**\n';
            body += details.join('\n');
            body += `\n**Totals**: ${totalPassed} passed, ${totalFailed} failed`;
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            } else {
              console.log(body);
            }


  cross-build:
    # Build all release targets so failures are caught before tagging
    if: ${{ !inputs.release_validation && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)) }}
    name: Cross build ${{ matrix.platform.release_for }}
    # Cold archive, host-packager and final-CLI compilation exceeded six hours
    # on the self-hosted Mac runners while still making compiler progress.
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        platform:
          - release_for: windows-x86_64
            os: warp-windows-latest-x64-16x
            target: x86_64-pc-windows-msvc
            bin: runmat.exe
          - release_for: macos-x86_64
            os: warp-macos-26-arm64-12x
            target: x86_64-apple-darwin
            bin: runmat
          - release_for: macos-aarch64
            os: warp-macos-26-arm64-12x
            target: aarch64-apple-darwin
            bin: runmat
          - release_for: linux-x86_64
            os: warp-ubuntu-latest-x64-16x
            target: x86_64-unknown-linux-gnu
            bin: runmat
    runs-on: ${{ matrix.platform.os }}
    env:
      # Each whole-crate release producer is large. Serializing them on the
      # smaller Mac/Windows builders avoids swap contention between producers.
      CARGO_BUILD_JOBS: ${{ matrix.platform.target == 'x86_64-unknown-linux-gnu' && '8' || '1' }}
      # Archive packaging executes a host-side Cargo tool in the dev profile.
      # Bound that tool's artifacts as well as the final release executable.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Prepare bounded Windows build storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $storage = & ./infra/scripts/prepare-windows-build-storage.ps1 `
            -TargetDirectory "$env:GITHUB_WORKSPACE/target" `
            -ScratchDirectory "$env:RUNNER_TEMP/runmat-build-scratch" `
            -ReclaimUnusedRunnerTools
          "TMP=$($storage.ScratchDirectory)" >> $env:GITHUB_ENV
          "TEMP=$($storage.ScratchDirectory)" >> $env:GITHUB_ENV

      - name: Resolve branch artifact identity
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        id: artifact-identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' crates/runmat-cli/Cargo.toml | head -n 1)"
          [[ -n "${VERSION}" ]] || { echo "Unable to read Runtime version." >&2; exit 1; }
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install native dependencies (Linux x86_64)
        if: runner.os == 'Linux' && matrix.platform.os != 'ubuntu-latest-arm-l'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libhdf5-dev libopenblas-dev liblapack-dev libzmq3-dev pkg-config libssl-dev

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: bash scripts/ci-install-macos-cross-dependencies.sh "${{ matrix.platform.target }}"

      - name: Set macOS product cache deployment policy
        if: runner.os == 'macOS'
        shell: bash
        run: |
          printf '%s\n' 'MACOSX_DEPLOYMENT_TARGET=11.0' 'CMAKE_OSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"

      - name: Restore Windows native dependency cache
        if: runner.os == 'Windows' && matrix.platform.target != 'aarch64-pc-windows-gnu'
        uses: actions/cache@v5
        with:
          path: ~/vcpkg-runmat/installed
          key: windows-vcpkg-a7eda31-${{ matrix.platform.target }}-${{ hashFiles('infra/vcpkg-ports/**', 'infra/scripts/ensure-windows-vcpkg-dependencies.ps1', 'infra/scripts/prepare-windows-cross-dependencies.ps1') }}

      - name: Install Windows MSVC native dependencies
        if: runner.os == 'Windows' && matrix.platform.target != 'aarch64-pc-windows-gnu'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./infra/scripts/prepare-windows-cross-dependencies.ps1 -Target "${{ matrix.platform.target }}"

      - name: Install Rust release target
        shell: bash
        run: rustup target add "${{ matrix.platform.target }}"

      - name: Restore native artifact build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-artifact-0.7-v2-${{ matrix.platform.target }}
          prefix-key: ${{ runner.os == 'macOS' && 'v1-rust-macos-min11-cmake11' || 'v0-rust' }}
          env-vars: MACOSX_DEPLOYMENT_TARGET CMAKE_OSX_DEPLOYMENT_TARGET
          cache-workspace-crates: true
          cache-on-failure: true
          save-if: false

      - name: Resolve native checkpoint compatibility
        id: native-checkpoint-key
        shell: bash
        env:
          RUNMAT_CACHE_TARGET: ${{ matrix.platform.target }}
          RUNMAT_CACHE_INPUTS: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml', '.github/workflows/ci.yml', '.github/workflows/release.yml', 'scripts/build-runmat-with-aot-runtime.*', 'scripts/ci-install-macos-cross-dependencies.sh', 'infra/scripts/native-build-cache-key.mjs', 'infra/scripts/native-build-cache-source.mjs', 'infra/scripts/*windows*.ps1', 'infra/vcpkg-ports/**') }}
        run: node infra/scripts/native-build-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: Restore rolling native checkpoint
        uses: actions/cache/restore@v5
        with:
          path: target
          key: ${{ steps.native-checkpoint-key.outputs.key }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.native-checkpoint-key.outputs.key }}-${{ github.sha }}-
            ${{ steps.native-checkpoint-key.outputs.key }}-

      - name: Restore byte-verified same-commit source timestamps
        shell: bash
        run: node infra/scripts/native-build-cache-source.mjs restore target/.runmat-source-inputs.json

      - name: Build branch CLI with embedded AOT runtime (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # Exercise the packager with styled ambient Cargo output. The
          # metadata-producing subprocess must remain deterministic.
          CARGO_TERM_COLOR: always
          CARGO_PROFILE_RELEASE_STRIP: symbols
          OPENSSL_NO_PKG_CONFIG: ${{ runner.os == 'macOS' && '1' || '0' }}
          OPENSSL_STATIC: ${{ runner.os == 'macOS' && '1' || '0' }}
          RUNMAT_BUILD_TARGET: ${{ matrix.platform.target }}
          RUNMAT_OCCT_LINK_MODE: static
        run: |
          set -euo pipefail
          features="blas-lapack,occt-native"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            features="$features,vendored-openssl"
          fi
          bash scripts/build-runmat-with-aot-runtime.sh \
            --locked --release --target "${{ matrix.platform.target }}" \
            --bin runmat --features "$features"

      - name: Build branch CLI with embedded AOT runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Exercise the PowerShell packager across the same color boundary.
          CARGO_TERM_COLOR: always
          CARGO_PROFILE_RELEASE_STRIP: symbols
          OPENSSL_NO_PKG_CONFIG: '1'
          OPENSSL_STATIC: '1'
          RUNMAT_BUILD_TARGET: ${{ matrix.platform.target }}
          RUNMAT_OCCT_LINK_MODE: dylib
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/build-runmat-with-aot-runtime.ps1 --locked --release --target "${{ matrix.platform.target }}" --bin runmat --features "blas-lapack,vendored-openssl,occt-native"
          if ($LASTEXITCODE -ne 0) { throw "embedded-runtime branch build failed with exit code $LASTEXITCODE" }


      - name: Stage and accept distributed product (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/release-product/${{ matrix.platform.release_for }}"
          source_revision="$(git rev-parse HEAD)"
          node scripts/runtime/stage-builtin-example-product.mjs \
            --binary "target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }}" \
            --destination "$root/product" --executable-name "${{ matrix.platform.bin }}"
          node scripts/runtime/verify-builtin-examples.mjs artifacts \
            --product native-cli --profile embedded-aot --source-revision "$source_revision" \
            --root "$root/product" --entrypoint "runmat-binary=${{ matrix.platform.bin }}" \
            --output "$root/${{ matrix.platform.release_for }}.artifact-manifest.json"
          node scripts/distribution/accept-native-product.mjs \
            "$root/${{ matrix.platform.release_for }}.artifact-manifest.json" \
            "$root/${{ matrix.platform.release_for }}.acceptance.json"

      - name: Stage and accept distributed product (Windows)
        if: runner.os == 'Windows' && matrix.platform.target != 'aarch64-pc-windows-gnu'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "artifacts/release-product/${{ matrix.platform.release_for }}"
          $sourceRevision = (& git rev-parse HEAD).Trim()
          $dxc = & ./scripts/distribution/prepare-windows-dxc-runtime.ps1 `
            -Target "${{ matrix.platform.target }}" `
            -Destination "target/windows-dxc/${{ matrix.platform.target }}"
          $arguments = @(
            "scripts/runtime/stage-builtin-example-product.mjs",
            "--binary", "target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }}",
            "--destination", "$root/product",
            "--executable-name", "${{ matrix.platform.bin }}"
          )
          $arguments += @("--dependency-dir", $dxc.BinDir, "--dependency-notice-dir", $dxc.NoticeDir)
          $vcpkgBin = Join-Path $env:VCPKG_ROOT ("installed\" + $env:VCPKG_DEFAULT_TRIPLET + "\bin")
          if (Test-Path $vcpkgBin) { $arguments += @("--dependency-dir", $vcpkgBin) }
          $zmqBin = Join-Path $env:ZMQ_PATH "bin"
          $zmqLib = Join-Path $env:ZMQ_PATH "lib"
          if (Test-Path $zmqBin) { $arguments += @("--dependency-dir", $zmqBin) }
          elseif (Test-Path $zmqLib) { $arguments += @("--dependency-dir", $zmqLib) }
          & node @arguments
          if ($LASTEXITCODE -ne 0) { throw "native product staging failed with exit code $LASTEXITCODE" }
          & node scripts/runtime/verify-builtin-examples.mjs artifacts `
            --product native-cli --profile embedded-aot --source-revision $sourceRevision `
            --root "$root/product" --entrypoint "runmat-binary=${{ matrix.platform.bin }}" `
            --output "$root/${{ matrix.platform.release_for }}.artifact-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "native artifact manifest failed with exit code $LASTEXITCODE" }
          & node scripts/distribution/accept-native-product.mjs `
            "$root/${{ matrix.platform.release_for }}.artifact-manifest.json" `
            "$root/${{ matrix.platform.release_for }}.acceptance.json"
          if ($LASTEXITCODE -ne 0) { throw "native product probe failed with exit code $LASTEXITCODE" }

      - name: Retain staged product acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-product-acceptance-${{ matrix.platform.release_for }}
          path: artifacts/release-product/${{ matrix.platform.release_for }}/*.json
          if-no-files-found: warn

      - name: Package branch artifact (Windows)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = "artifacts/release-product/${{ matrix.platform.release_for }}/product"
          $artifactName = "runmat-${{ steps.artifact-identity.outputs.version }}-${{ matrix.platform.release_for }}"
          $archive = Join-Path (Get-Location) "$artifactName.zip"
          Push-Location $outDir
          try {
            & 7z a $archive .\*
            if ($LASTEXITCODE -ne 0) { throw "Branch archive creation failed" }
          } finally { Pop-Location }

      - name: Package branch artifact (Unix)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME="runmat-${{ steps.artifact-identity.outputs.version }}-${{ matrix.platform.release_for }}"
          tar -C "artifacts/release-product/${{ matrix.platform.release_for }}/product" -czf "${ARTIFACT_NAME}.tar.gz" .

      - name: Record branch artifact provenance (Windows)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "runmat-${{ steps.artifact-identity.outputs.version }}-${{ matrix.platform.release_for }}.zip"
          $provenance = @{
            schema_version = 1
            source_branch = "${{ github.ref_name }}"
            source_sha = "${{ github.sha }}"
            version = "${{ steps.artifact-identity.outputs.version }}"
            platform = "${{ matrix.platform.release_for }}"
            archive = $archive
            sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            workflow_run_id = "${{ github.run_id }}"
          }
          [IO.File]::WriteAllText("runtime-artifact-provenance.json", ($provenance | ConvertTo-Json), [Text.UTF8Encoding]::new($false))

      - name: Record branch artifact provenance (Unix)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="runmat-${{ steps.artifact-identity.outputs.version }}-${{ matrix.platform.release_for }}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            DIGEST="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          else
            DIGEST="$(shasum -a 256 "${ARCHIVE}" | awk '{print $1}')"
          fi
          cat > runtime-artifact-provenance.json <<JSON
          {
            "schema_version": 1,
            "source_branch": "${{ github.ref_name }}",
            "source_sha": "${{ github.sha }}",
            "version": "${{ steps.artifact-identity.outputs.version }}",
            "platform": "${{ matrix.platform.release_for }}",
            "archive": "${ARCHIVE}",
            "sha256": "${DIGEST}",
            "workflow_run_id": "${{ github.run_id }}"
          }
          JSON

      - name: Upload branch artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: runmat-${{ steps.artifact-identity.outputs.version }}-${{ matrix.platform.release_for }}
          path: |
            runmat-*.tar.gz
            runmat-*.zip
            runtime-artifact-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Save rolling native checkpoint
        id: native-checkpoint-source
        if: always() && steps.native-checkpoint-key.outputs.key != ''
        shell: bash
        run: node infra/scripts/native-build-cache-source.mjs capture target/.runmat-source-inputs.json

      - name: Upload rolling native checkpoint
        if: always() && steps.native-checkpoint-source.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: target
          key: ${{ steps.native-checkpoint-key.outputs.key }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  runtime-artifacts-ready:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs: cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Record complete Runtime artifact matrix
        shell: bash
        run: |
          cat > runtime-artifacts-ready.json <<JSON
          {
            "schema_version": 1,
            "source_branch": "${{ github.ref_name }}",
            "source_sha": "${{ github.sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "platforms": ["linux-x86_64", "macos-aarch64", "macos-x86_64", "windows-x86_64"]
          }
          JSON
      - name: Publish Runtime artifact readiness marker
        uses: actions/upload-artifact@v7
        with:
          name: runmat-runtime-artifacts-ready
          path: runtime-artifacts-ready.json
          if-no-files-found: error
          retention-days: 30
