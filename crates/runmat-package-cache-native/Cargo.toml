[package]
name = "runmat-package-cache-native"
version = "0.6.1"
edition = "2021"
description = "Native transactional storage and materialization adapter for RunMat packages"
license = "Apache-2.0"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
dirs = "5"
fs2 = "0.4"
futures = "0.3"
git2 = { version = "0.20", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
runmat-package = { workspace = true }
runmat-package-cache = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tempfile = "3.12"
zeroize = "1"

[dev-dependencies]
