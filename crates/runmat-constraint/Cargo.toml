[package]
name = "runmat-constraint"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "2D sketch and 3D mate constraint solver for RunMat CAD: rigid-cluster construction and DM decomposition, Newton/Levenberg-Marquardt and dog leg with exact AD Jacobians, NURBS and ellipses, limits, DOF and redundancy diagnosis"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

# Deliberately dependency-light: the solver carries its own small sparse LDLᵀ, minimum-degree
# ordering and Givens row QR so the crate builds in seconds and stays deterministic. serde
# (default-on) serialises solve reports and options for the CAD layer.
[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
