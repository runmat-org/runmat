[package]
name = "runmat-node-agent"
version = "0.6.1"
edition = "2021"
license-file = "../../LICENSE.md"
description = "RunMat remote execution node service"

[[bin]]
name = "runmat-node-agent"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
base64 = "0.22"
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sysinfo = "0.30"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
runmat-execution-transport-native = { workspace = true }
runmat-execution = { workspace = true }
runmat-execution-artifact = { workspace = true }
runmat-process-host = { workspace = true }
runmat-server-client = { workspace = true }

[dev-dependencies]
tempfile = "3.12"
