[package]
name = "runmat-builtins"
version = "0.6.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../LICENSE.md"
description = "RunMat built-in functions and standard library components"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
inventory = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
runmat-async = { workspace = true }
runmat-value = { workspace = true }
runmat-types = { workspace = true }

[dev-dependencies]
runmat-macros = { workspace = true }
