[package]
name = "runmat-mir"
version = "0.7.0"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Mid-level IR and analysis scaffolding for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[features]
default = ["compiler"]
compiler = ["dep:runmat-hir"]

[dependencies]
runmat-builtins = { workspace = true }
runmat-hir = { workspace = true, optional = true }
runmat-types = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
runmat-parser = { workspace = true }
