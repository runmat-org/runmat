[package]
name = "runmat-native-codegen"
version = "0.6.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../LICENSE.md"
description = "Verified generic Native IR and deterministic native compilation products for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
runmat-execution = { workspace = true }
runmat-mir = { workspace = true }
runmat-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift = { workspace = true }
cranelift-codegen = { workspace = true }
cranelift-module = { workspace = true }
cranelift-native = { workspace = true }
cranelift-object = { workspace = true }
runmat-runtime = { workspace = true, features = ["plot-core"] }
target-lexicon = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
runmat-runtime = { workspace = true, features = ["plot-web"] }

[dev-dependencies]
runmat-hir = { workspace = true }
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cranelift-jit = { workspace = true }
