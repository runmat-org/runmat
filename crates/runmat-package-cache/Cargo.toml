[package]
name = "runmat-package-cache"
version = "0.6.2"
edition = "2021"
description = "Portable transactional package cache policy and state machine for RunMat"
license = "Apache-2.0"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
base64 = "0.22"
futures = "0.3"
globset = "0.4"
runmat-package = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-casefold = "0.2"
unicode-normalization = "0.1"

[dev-dependencies]
futures = "0.3"
