[package]
name = "runmat-accelerate"
version = "0.7.0"
edition = "2021"
license-file = "../../LICENSE.md"
description = "Pluggable GPU acceleration layer for RunMat (CUDA, ROCm, Metal, Vulkan/Spir-V)"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[features]
# Backends are opt-in features
cuda = ["dep:libloading"]
rocm = []
metal = []
vulkan = []
opencl = []
wgpu = [
    "dep:wgpu",
    "dep:pollster",
    "dep:libc",
    "dep:naga",
    "dep:ash",
    "dep:spirv",
    "runmat-accelerate-api/wgpu",
]

[dependencies]
runmat-value = { workspace = true }
serde = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
runmat-builtins = { workspace = true }
runmat-runtime = { workspace = true }
runmat-gc = { workspace = true }
runmat-types = { workspace = true }
runmat-accelerate-api = { workspace = true }
runmat-execution = { workspace = true }
runmat-time = { workspace = true }
once_cell = "1"
bytemuck = { version = "1.14", features = ["derive"] }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }
dirs = "5.0"
num-complex = "0.4"
rustfft = "6.2"
smallvec = "1.13"
rand = "0.8"
tracing = "0.1"
futures = "0.3"
hashbrown = "=0.16.1"
libm = "0.2"

# Optional backend deps
pollster = { version = "0.3", optional = true }
naga = { version = "24.0.0", features = ["wgsl-in"], optional = true }

[dev-dependencies]
runmat-accelerate-api = { workspace = true, features = ["test-support"] }
runmat-vm = { workspace = true }
runmat-parser = { workspace = true }
runmat-hir = { workspace = true }
runmat-mir = { workspace = true, features = ["compiler"] }
naga = { version = "24.0.0", features = ["wgsl-in"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, optional = true }
tokio = { workspace = true, default-features = false, features = ["macros", "rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "DomException",
  "DomStringList",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = { version = "0.2", optional = true }
naga = { version = "24.0.0", features = ["spv-out"], optional = true }
spirv = { version = "0.3", optional = true }
wgpu = { workspace = true, optional = true }
libloading = { version = "0.8.9", optional = true }
tokio = { workspace = true, default-features = false, features = ["macros", "rt-multi-thread"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ash = { version = "0.38", optional = true }

[[bench]]
name = "direct_call_observation"
harness = false
