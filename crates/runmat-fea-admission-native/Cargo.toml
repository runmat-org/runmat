[package]
name = "runmat-fea-admission-native"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Native local FEA lease admission shared by RunMat hosts"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
runmat-execution = { workspace = true }
runmat-runtime = { workspace = true }
runmat-server-client = { workspace = true }
runmat-simulation-usage = { workspace = true }
reqwest = { version = "0.12", default-features = false }
tokio = { workspace = true, features = ["rt", "net", "time", "sync"] }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
