[package]
name = "runmat-server-client"
version = "0.7.1"
edition = "2021"
description = "Authenticated public API client and auth helpers for RunMat server integrations"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
dirs = "5.0"
ed25519-dalek = { workspace = true }
fs2 = "0.4"
keyring = "2.3"
rand = "0.8"
runmat-execution = { workspace = true }
runmat-package = { workspace = true }
runmat-types = { workspace = true }
runmat-simulation-usage = { workspace = true }
progenitor-client = "0.11"
regress = "0.10"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tokio = { workspace = true, features = ["net", "time", "sync"] }
url = "2.5"
uuid = { workspace = true, features = ["serde"] }
webbrowser = "0.8"

[build-dependencies]
openapiv3 = "2.0"
progenitor = "0.11"
serde_yaml = "0.9"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
