[package]
name = "runmat-circuit-wasm"
version = "0.6.2"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "WebAssembly entry points of the RunMat PCB document runtime: compile, review and edit .circuit and .circuit.layout files for the Desktop and the browser"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
runmat-circuit = { path = "..", version = "=0.6.2" }
# Circuit simulation: the native engine (ours), its reports and its operation counts.
runmat-circuit-spice = { path = "../../runmat-circuit-spice", version = "=0.6.2" }
runmat-circuit-sim = { path = "../../runmat-circuit-sim", version = "=0.6.2" }
runmat-simulation-usage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
