[package]
name = "runmat-circuit"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "RunMat PCB core: circuit IR with stable ids, pool library and footprint generators, connectivity and ERC, board layout with stackup and zone fill, spatial index, incremental DRC, routing primitives, clean-room KiCad interchange, fabrication outputs, design-review suites and the board-to-FEA contract"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

# Pure Rust and dependency-light: integer-nanometre geometry with its own exact polygon
# booleans, ordered maps everywhere, no hashing, so every output is deterministic.
[dependencies]
# The shared design grammar (the `.circuit` front end in `syntax`).
runmat-design-syntax = { workspace = true }
runmat-types = { workspace = true }
runmat-rules = { path = "../runmat-rules", version = "=0.7.1" }
# The orderable part record, shared with the server's part search.
runmat-part-record = { path = "../runmat-part-record", version = "=0.7.1" }
# Design-command descriptor types (one schema for CAD and PCB commands) and the JSON writer.
runmat-design-commands = { path = "../runmat-design-commands", version = "=0.7.1" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# An independent Gerber reader (MIT OR Apache-2.0): the fabrication tests parse every Gerber
# file the writer makes with it.
gerber_parser = "0.5"
