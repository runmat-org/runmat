[package]
name = "runmat-execution-transport-native"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Native QUIC and WebSocket transport adapters for RunMat execution"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { workspace = true }
futures-util = "0.3"
minicbor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
runmat-execution = { workspace = true }
runmat-execution-artifact = { workspace = true }
runmat-server-client = { workspace = true }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
quinn = "0.11"
# Enforce the protocol security floor for downstream crates.io resolutions too.
# Keep Quinn's existing feature selection; this adds no protocol features.
quinn-proto = { version = "0.11.15", default-features = false }
rustls = "0.23"
sha2 = { workspace = true }
hex = { workspace = true }
socket2 = "0.6"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
rcgen = "0.14"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
