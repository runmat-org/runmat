[package]
name = "runmat-accelerate-api"
version = "0.6.2"
edition = "2021"
description = "Common API types for RunMat GPU acceleration backends"
license-file = "../../LICENSE.md"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[features]
default = []
test-support = []
wgpu = ["dep:wgpu"]

[dependencies]
runmat-execution = { workspace = true }
runmat-types = { workspace = true }
runmat-time = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
once_cell = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "24.0.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "0.19", optional = true }
