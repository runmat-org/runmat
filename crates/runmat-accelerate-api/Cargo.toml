[package]
name = "runmat-accelerate-api"
version = "0.7.0"
edition = "2021"
description = "Common API types for RunMat GPU acceleration backends"
license-file = "../../LICENSE.md"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[features]
default = []
test-support = []
wgpu = ["dep:wgpu", "dep:ash"]

[dependencies]
runmat-execution = { workspace = true }
runmat-types = { workspace = true }
runmat-time = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = "0.3"
tracing = "0.1"
once_cell = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, optional = true }
ash = { version = "0.38", optional = true }
