[package]
name = "runmat-execution-runner-native"
version = "0.7.0"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Native process adapter for RunMat execution"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[features]
default = []
gui = ["runmat-core/gui", "runmat-runtime/gui"]
occt-native = ["runmat-geometry-io/occt-native", "runmat-analysis-execution/occt-native"]

[dependencies]
runmat-simulation-usage = { workspace = true }
runmat-fea-admission-native = { workspace = true }
runmat-server-client = { workspace = true }
sysinfo = { version = "0.30", default-features = false }
runmat-cpu-execution = { workspace = true }
runmat-analysis-core = { workspace = true }
runmat-analysis-execution = { workspace = true }
runmat-analysis-distributed = { workspace = true }
runmat-analysis-fea = { workspace = true }
runmat-analysis-language = { workspace = true }
runmat-accelerate-api = { workspace = true }
runmat-value = { workspace = true }
runmat-accelerate = { workspace = true, features = ["cuda"] }
runmat-builtins = { workspace = true }
runmat-canonical-codec = { workspace = true }
runmat-core = { workspace = true }
runmat-config = { workspace = true }
runmat-execution = { workspace = true }
runmat-execution-artifact = { workspace = true }
runmat-execution-runner = { workspace = true }
runmat-execution-transport-native = { workspace = true }
runmat-filesystem = { workspace = true }
runmat-geometry-core = { workspace = true }
runmat-geometry-io = { workspace = true }
runmat-geometry-ops = { workspace = true }
runmat-meshing-core = { workspace = true }
runmat-meshing-execution = { workspace = true }
runmat-native-ffi = { workspace = true }
runmat-mex = { workspace = true }
runmat-java = { workspace = true }
runmat-python = { workspace = true }
runmat-process-host = { workspace = true }
runmat-package = { workspace = true }
runmat-runtime = { workspace = true }
runmat-test-runner = { workspace = true }
runmat-test-runner-execution = { workspace = true }
runmat-types = { workspace = true }
runmat-vm = { workspace = true }
runmat-mir = { workspace = true }
dirs = "5.0"
base64 = "0.22"
futures = "0.3"
async-trait = "0.1"
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["serde"] }
tempfile = "3.20"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "blob"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
runmat-gc = { workspace = true }
runmat-logging = { workspace = true }
rcgen = "0.14"
runmat-geometry-fixtures = { workspace = true }
runmat-meshing-curve = { workspace = true }
runmat-mir = { workspace = true }
runmat-native-codegen = { workspace = true, features = ["compiler"] }
runmat-test = { workspace = true }
runmat-types = { workspace = true }
target-lexicon = "0.12"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[[test]]
name = "meshing_process_conformance"
path = "tests/meshing_process_conformance.rs"
harness = false

[[test]]
name = "analysis_process_conformance"
path = "tests/analysis_process_conformance.rs"
harness = false

[[test]]
name = "graph_worker_roundtrip"
path = "tests/graph_worker_roundtrip.rs"
harness = false

[[test]]
name = "supervisor_process_conformance"
path = "tests/supervisor_process_conformance.rs"
harness = false

[[test]]
name = "output_process_conformance"
path = "tests/output_process_conformance.rs"
harness = false

[build-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
