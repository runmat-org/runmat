[package]
name = "runmat-aot"
version = "0.7.0"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "RunMat native AOT archive, target, and system-link orchestration"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
runmat-execution = { workspace = true }
runmat-execution-artifact = { workspace = true }
runmat-package-cache = { workspace = true }
runmat-package = { workspace = true }
runmat-core = { workspace = true }
runmat-builtins = { workspace = true }
runmat-mir = { workspace = true, features = ["compiler"] }
runmat-native-codegen = { workspace = true, features = ["compiler"] }
runmat-native-ffi = { workspace = true }
runmat-mex = { workspace = true }
runmat-java = { workspace = true }
runmat-python = { workspace = true }
runmat-runtime = { workspace = true, features = ["plot-core"] }
runmat-types = { workspace = true }
runmat-test = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
target-lexicon = { workspace = true }
tempfile = "3.27"
thiserror = { workspace = true }
zstd = "0.13"
object = { version = "0.37.3", default-features = false, features = ["read", "std"] }
same-file = "1.0.6"

[target.'cfg(windows)'.dependencies]
ar_archive_writer = "0.5.2"
cc = "1.2"

[dev-dependencies]
object = { version = "0.37.3", default-features = false, features = ["write"] }
ar_archive_writer = "0.5.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
