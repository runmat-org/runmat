[package]
name = "runmat-geometry-core"
version = "0.7.0"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "Canonical geometry domain model for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[features]
tool-schema = ["dep:schemars", "runmat-types/tool-schema"]

[dependencies]
runmat-types = { workspace = true }
schemars = { version = "0.8", optional = true }
runmat-canonical-codec = { workspace = true }
serde = { workspace = true, features = ["rc"] }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[build-dependencies]
runmat-build-identity = { workspace = true }
