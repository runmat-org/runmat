[package]
name = "runmat-geometry-wasm-host"
description = "Typed exact-geometry host boundary for RunMat WebAssembly execution"
version = "0.7.0"
edition = "2021"
license-file = "../../../LICENSE.md"
[lib]
crate-type = ["rlib"]
[[bin]]
name = "runmat_geometry_wasm_host"
path = "src/main.rs"
[dependencies]
runmat-geometry-io = { workspace = true, features = ["occt-native"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

runmat-analysis-execution = { workspace = true, features = ["occt-native"] }
runmat-execution = { workspace = true }
runmat-execution-artifact = { workspace = true }
runmat-meshing-core = { workspace = true }
runmat-meshing-execution = { workspace = true }
