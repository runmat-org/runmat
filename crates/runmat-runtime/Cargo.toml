[package]
name = "runmat-runtime"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Core runtime for RunMat with builtins, BLAS/LAPACK integration, and execution APIs"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"
build = "build.rs"
links = "runmat_runtime_native"

[dependencies]
uuid = { version = "1", default-features = false, features = ["serde"] }
clarabel = { workspace = true }
runmat-fea-source = { workspace = true }
allocator-api2 = "=0.2.21"
hashbrown = "=0.16.1"
async-trait = "0.1"
getrandom = { version = "0.2", features = ["js", "std"] }
runmat-value = { workspace = true }
runmat-extension-abi = { workspace = true }
runmat-types = { workspace = true }
runmat-mex = { workspace = true }
inventory = { workspace = true }
runmat-builtins = { workspace = true }
runmat-execution = { workspace = true }
runmat-macros = { workspace = true }
runmat-async = { workspace = true }
runmat-test = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
runmat-plot = { workspace = true, optional = true }
runmat-accelerate-api = { workspace = true, features = ["wgpu"] }
runmat-gc = { workspace = true }
runmat-gc-api = { workspace = true }
runmat-filesystem = { workspace = true }
runmat-geometry-core = { workspace = true }
runmat-geometry-io = { workspace = true }
runmat-geometry-ops = { workspace = true }
runmat-analysis-core = { workspace = true }
runmat-canonical-codec = { workspace = true }
runmat-analysis-fea = { workspace = true }
runmat-analysis-language = { workspace = true }
runmat-meshing-core = { workspace = true }
runmat-time = { workspace = true }
runmat-cpu-execution = { workspace = true }
runmat-thread-local = { workspace = true }
serde = { workspace = true, features = ["derive"] }
glam = "0.24"
once_cell = "1.19"
encoding_rs = "0.8.35"
http = "1.4"
quick-xml = { version = "0.39.4", features = ["async-tokio"] }
tokio = { version = "1.36", default-features = false, features = ["io-util", "rt", "sync"] }
chrono = { workspace = true }
jiff = { version = "=0.2.28", default-features = false, features = [
    "std",
    "js",
    "tz-system",
    "tzdb-bundle-platform",
    "tzdb-zoneinfo",
    "tzdb-concatenated",
] }
libc = "0.2"
log = { workspace = true }
tracing = "0.1"
libm = "0.2"
complex-bessel = { version = "=0.3.0", default-features = false }
num-complex = "0.4"
runmat-sparse-solvers = { workspace = true }
runmat-simulation-usage = { workspace = true }
num-bigint = "0.4"
num-rational = "=0.4.2"
num-traits = "0.2"
sobol = { workspace = true }
nalgebra = "0.32"
faer = { version = "=0.24.4", default-features = false, features = ["std", "linalg", "sparse-linalg"] }
rustfft = "6.2"
futures = "0.3.32"
pin-project-lite = "0.2.17"
async-recursion = "1.1"
flate2 = "1.1"
compression-codecs = { version = "0.4.38", default-features = false, features = ["gzip"] }

# BLAS/LAPACK bindings for high-performance linear algebra (optional)
blas = { version = "0.22", optional = true }
lapack = { version = "0.19", optional = true }
regex = "1.11.1"
glob = "0.3"
url = "2.5"
base64 = "0.22"
sha2 = { workspace = true }
hex = { workspace = true }
target-lexicon = { workspace = true }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "ico"] }
calamine = { version = "0.35.0", features = ["chrono"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

# Platform-specific BLAS/LAPACK implementations
[target.'cfg(target_os = "macos")'.dependencies]
# Use Apple's Accelerate framework on macOS (works on both Intel and Apple Silicon)
accelerate-src = { version = "0.3", optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
# macOS release artifacts must be self-contained and cross-buildable from Apple
# Silicon hosts. Build HDF5 for Cargo's target architecture and link it
# statically instead of discovering a host-architecture Homebrew installation.
hdf5 = { package = "hdf5-metno", version = "0.13.0", features = ["static", "zlib"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Use system OpenBLAS via vcpkg on Windows and distro packages on Linux; also expose CBLAS symbols
openblas-src = { version = "0.10", features = ["system", "cblas"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos")))'.dependencies]
hdf5 = { package = "hdf5-metno", version = "0.13.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-io = "2"
runmat-process-host = { workspace = true }
runmat-native-ffi = { workspace = true }
runmat-java = { workspace = true }
runmat-python = { workspace = true }
arrow-array = "59.0.0"
arrow-schema = "59.0.0"
bytes = "1.12.0"
ndarray = "0.17"
parquet = { version = "59.0.0", features = ["arrow"] }
pollster = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "charset", "gzip", "json", "rustls-tls"] }
tokio = { version = "1.36", features = ["macros", "rt", "time", "sync", "net", "io-util"] }
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Networking_WinSock"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Url", "XmlHttpRequest", "XmlHttpRequestResponseType", "Window", "WorkerGlobalScope", "AbortController", "AbortSignal", "Headers", "Request", "RequestInit", "Response", "ReadableStream", "ReadableStreamDefaultReader", "TextDecoder", "DomException", "CustomEvent", "CustomEventInit", "EventTarget", "Event", "DomStringList", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
tokio = { version = "1.36", default-features = false, features = ["macros", "rt"] }
wgpu = { workspace = true }
runmat-accelerate = { workspace = true, features = ["wgpu"] }

[features]
default = ["plot-core"]

# Core plotting types (figures, builders, shared renderer structs)
plot-core = ["dep:runmat-plot"]

# GUI plotting support
gui = ["plot-core", "runmat-plot/gui", "runmat-plot/static"]

# WebGPU plotting (used by wasm builds)
plot-web = [
    "plot-core",
    "runmat-plot/web",
    "runmat-plot/static",
]

# High-performance BLAS/LAPACK support using platform-native libraries
# macOS: Uses Apple's Accelerate framework (WORKS on both Intel and Apple Silicon!)
# Other platforms: Uses OpenBLAS
# Usage: cargo test --features blas-lapack
blas-lapack = ["blas", "lapack", "accelerate-src", "openblas-src"]

# BLAS-only support (no LAPACK)
# macOS: Uses Accelerate
# Other platforms: Uses OpenBLAS
blas-only = ["blas", "accelerate-src", "openblas-src"]

# Internal testing utilities (class registry seeders)
test-classes = []

# Enable WGPU-backed tests (tests enable runmat-accelerate's feature through dev-dependencies)
wgpu = []

# Internal helper to make stdin/key prompts behave interactively during tests.
interaction-test-hooks = []

# Optional CAD topology import through OpenCascade. The native feature links OCCT
# through runmat-geometry-io; the wasm feature expects a host-provided sidecar.
occt-native = ["runmat-geometry-io/occt-native"]
occt-wasm-host = ["runmat-geometry-io/occt-wasm-host"]

[dev-dependencies]
runmat-geometry-fixtures = { workspace = true }
runmat-accelerate-api = { workspace = true, features = ["test-support"] }
runmat-macros = { workspace = true } 
matfile = "0.5.0"
tempfile = "3.20"
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = "0.7"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
runmat-accelerate = { workspace = true, features = ["wgpu"] }
wgpu = { workspace = true }

[dependencies.serde_json]
version = "1.0"
features = ["float_roundtrip"]

[build-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = "1.0"

[[test]]
name = "native_ffi_session"
path = "tests/native_ffi_session.rs"
harness = false
