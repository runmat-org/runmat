[package]
name = "runmat-python"
version = "0.6.2"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Native CPython interoperability for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
libloading = "0.8.9"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
tempfile = "3.12"

[dev-dependencies]
