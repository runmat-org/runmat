python = [
    "dep:derive_more",
    "dep:num-derive",
    "dep:libc",
    "dep:pyo3",
    "buildinfo",
    "faer-sparse",
    "serde",
    "sdp",
]
sdp = [
    "blas",
    "lapack",
    "indexmap",
]
sdp-accelerate = [
    "sdp",
    "blas-src/accelerate",
    "lapack-src/accelerate",
]
sdp-mkl = [
    "sdp",
    "blas-src/intel-mkl",
    "lapack-src/intel-mkl",
    "intel-mkl-src",
]
sdp-netlib = [
    "sdp",
