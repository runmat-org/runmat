[package]
edition = "2021"
rust-version = "1.90.0"
name = "runmat-clarabel"
version = "0.7.0"
# Derived from Clarabel.rs 0.11.1; see UPSTREAM.md for the pinned release,
# original license and the narrow cooperative execution extension.
authors = ["Paul Goulart <paul.goulart@eng.ox.ac.uk>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "RunMat cooperative integration of the Clarabel 0.11.1 conic interior-point solver"
readme = "README.md"
keywords = [
    "convex",
    "optimization",
    "conic",
    "solver",
    "linear-programming",
]
categories = ["mathematics"]
license = "Apache-2.0"
repository = "https://github.com/runmat-org/runmat"

[package.metadata.docs.rs]
features = ["serde"]
rustdoc-args = [
    "--html-in-header",
    "./html/rustdocs-header.html",
]

[features]
bench = []
