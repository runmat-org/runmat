[package]
name = "runmat"
version = "0.7.0"
edition = "2021"
description = "High-performance MATLAB/Octave syntax mathematical runtime"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
readme = "../../README.md"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"
keywords = ["matlab", "octave", "interpreter", "runtime", "compiler"]
categories = ["science", "development-tools"]

[[bin]]
name = "runmat"
path = "src/main.rs"

[dependencies]
runmat-fea-admission-native = { workspace = true }
runmat-value = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal"] }
futures = "0.3"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
toml = "0.8"
dirs = "5.0"
atty = "0.2"
env_logger = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
rand = "0.8"
keyring = "2.3"
miette = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
crossbeam-channel = "0.5"
once_cell = "1.19"
ureq = { version = "2.9", default-features = false, features = ["tls", "json"] }
rustyline = "14.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
owo-colors = "4.3.0"
supports-color = "3.0.2"
libc = "0.2"
target-lexicon = { workspace = true }
tempfile = "3.20"
zeroize = "1"

# Ensure vendored OpenSSL can be enabled for cross targets (feature unification)
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9.109", optional = true }

# RunMat crates
runmat-core = { version = "=0.7.0", path = "../runmat-core" }
runmat-mex = { workspace = true }
runmat-aot = { workspace = true }
runmat-native-codegen = { workspace = true, features = ["compiler"] }
runmat-execution = { workspace = true }
runmat-execution-artifact = { workspace = true }
runmat-execution-runner-native = { workspace = true }
runmat-geometry-core = { workspace = true }
runmat-geometry-io = { workspace = true }
runmat-analysis-core = { workspace = true }
runmat-analysis-execution = { workspace = true }
runmat-analysis-fea = { workspace = true }
runmat-analysis-language = { workspace = true }
runmat-meshing-core = { workspace = true }
runmat-meshing-execution = { workspace = true }
runmat-native-ffi = { workspace = true }
runmat-java = { workspace = true }
runmat-process-host = { workspace = true }
runmat-parser = { version = "=0.7.0", path = "../runmat-parser" }
runmat-hir = { version = "=0.7.0", path = "../runmat-hir" }
runmat-mir = { version = "=0.7.0", path = "../runmat-mir", features = ["compiler"] }
runmat-vm = { version = "=0.7.0", path = "../runmat-vm" }
runmat-runtime = { version = "=0.7.0", path = "../runmat-runtime" }
runmat-gc = { version = "=0.7.0", path = "../runmat-gc" }
runmat-builtins = { version = "=0.7.0", path = "../runmat-builtins" }
runmat-plot = { version = "=0.7.0", path = "../runmat-plot" }
runmat-accelerate = { version = "=0.7.0", path = "../runmat-accelerate" }
runmat-accelerate-api = { version = "=0.7.0", path = "../runmat-accelerate-api" }
runmat-config = { version = "=0.7.0", path = "../runmat-config", features = ["accelerate"] }
runmat-package = { workspace = true }
runmat-package-cache = { workspace = true }
runmat-package-cache-native = { workspace = true }
runmat-time = { version = "=0.7.0", path = "../runmat-time" }
runmat-types = { workspace = true }
runmat-filesystem = { version = "=0.7.0", path = "../runmat-filesystem" }
runmat-telemetry = { version = "=0.7.0", path = "../runmat-telemetry" }
runmat-logging = { workspace = true, features = ["otlp"] }
runmat-static-analysis = { version = "=0.7.0", path = "../runmat-static-analysis" }
runmat-server-client = { workspace = true }
runmat-node-agent = { workspace = true }
runmat-test = { workspace = true }
runmat-test-runner = { workspace = true }
runmat-test-runner-execution = { workspace = true }
runmat-test-runner-native = { workspace = true }
runmat-python = { workspace = true }
runmat-design-tools = { path = "../runmat-design-tools", version = "=0.7.0", features = ["m-values"] }
sha2 = { workspace = true }
hex = { workspace = true }

[features]
# High-level feature toggles (default build keeps everything enabled)
default = ["gui", "blas-lapack", "wgpu", "cuda", "jit", "occt-native"]
wgpu = ["runmat-accelerate/wgpu", "runmat-runtime/wgpu"]
cuda = ["runmat-accelerate/cuda"]
gui = ["runmat-plot/gui", "runmat-runtime/gui", "runmat-core/gui"]
blas-lapack = ["runmat-runtime/blas-lapack"]
blas-only = ["runmat-runtime/blas-only"]
jit = ["runmat-core/jit"]
vendored-openssl = ["openssl/vendored", "openssl-sys/vendored"]
occt-native = [
    "runmat-core/occt-native",
    "runmat-execution-runner-native/occt-native",
    "runmat-runtime/occt-native",
]

[dev-dependencies]
ed25519-dalek = "2"
runmat-simulation-usage = { workspace = true }
runmat-geometry-ops = { workspace = true }
libc = "0.2"
tempfile = "3.20"
git2 = { version = "0.20", default-features = false }
serde_json = { workspace = true }
openapiv3 = "2.0"
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
