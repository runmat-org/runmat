[package]
name = "runmat-plot"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "GPU-accelerated and static plotting for RunMat with WGPU and Plotters"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
runmat-value = { workspace = true }
runmat-types = { workspace = true }
runmat-accelerate-api = { workspace = true, features = ["wgpu"] }
# Interactive GPU-accelerated plotting
bytemuck = { version = "1.0", features = ["derive"] }

# Math and geometry
glam = "0.24"

# Async runtime for WGPU
pollster = "0.3"
futures = "0.3"

# Runtime environment detection
log = "0.4"
tracing = "0.1"
once_cell = "1.19"

# Serialization and config
serde = { workspace = true }
serde_json = { workspace = true }

# Image processing for export
image = { version = "0.24", features = ["png", "jpeg"] }
font8x8 = "0.3"
rfd = { version = "0.15", optional = true }



# RunMat integration
thiserror = { workspace = true }
runmat-time = { workspace = true }
runmat-thread-local = { workspace = true }
runmat-builtins = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true }
egui = { version = "0.31.1", optional = true }
egui-wgpu = { version = "0.31.1", optional = true, default-features = false }
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "Window",
    "Document",
    "DomRect"
] }
tokio = { version = "1.0", default-features = false, features = ["sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
winit = { version = "0.30.7", optional = true }
egui = { version = "0.31.1", optional = true }
egui-wgpu = { version = "0.31.1", optional = true }
egui-winit = { version = "0.31.1", optional = true }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
default = ["static", "gui"]
static = []  # Static image export (always enabled)
# Lightweight egui overlay renderer (usable on wasm without winit).
egui-overlay = ["egui", "egui-wgpu"]
# Interactive GUI (native windowing + egui integration; compiled only on non-wasm targets).
gui = ["winit", "egui-overlay", "egui-winit", "rfd"]
web = []  # WebGL backend for web

[[example]]
name = "native_gui_smoke"
path = "examples/native_gui_smoke.rs"
required-features = ["gui"]

[dev-dependencies]
naga = { version = "24.0.0", features = ["wgsl-in"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
runmat-accelerate-api = { workspace = true, features = ["test-support"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
runmat-accelerate-api = { workspace = true, features = ["test-support"] }
tokio = { version = "1.0", default-features = false, features = ["rt", "macros"] }
wasm-bindgen-test = "0.3"
