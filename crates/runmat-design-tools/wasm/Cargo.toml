[package]
name = "runmat-design-tools-wasm"
version = "0.6.2"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "WebAssembly entry point of the design tool layer, for the browser without a server project: design.overview, check, inspect, ERC and DRC on .circuit and .circuit.layout files"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
runmat-design-tools = { path = "..", version = "=0.6.2" }
serde_json = { workspace = true }
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "forbid"
