[package]
name = "runmat-design-tools"
version = "0.7.0"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "The design tool layer: check, render, inspect, DRC and ERC, import, export and staged edits on .part, .assembly, .drawing, .circuit and .circuit.layout files, declared once for MCP clients and the in-app agent"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"
publish = false

[dependencies]
runmat-cad = { path = "../runmat-cad", version = "=0.7.0" }
runmat-cad-wasm = { path = "../runmat-cad/wasm", version = "=0.7.0", default-features = false }
runmat-circuit = { path = "../runmat-circuit", version = "=0.7.0" }
runmat-circuit-sim = { path = "../runmat-circuit-sim", version = "=0.7.0" }
runmat-circuit-spice = { path = "../runmat-circuit-spice", version = "=0.7.0", features = ["schema"] }
runmat-design-commands = { path = "../runmat-design-commands", version = "=0.7.0" }
runmat-design-syntax = { workspace = true }
runmat-rules = { path = "../runmat-rules", version = "=0.7.0" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "0.8"
base64 = "0.22"
sha2 = { workspace = true }
hex = { workspace = true }
# Inflate for reading deflated ZIP entries (3MF packages from other applications). MIT OR Zlib OR Apache-2.0.
miniz_oxide = "0.8"
runmat-plot = { workspace = true, optional = true }
pollster = { version = "0.3", optional = true }
glam = { version = "0.24", optional = true }
# OCCT as the design kernel (native callers: the MCP and HTTP servers, the native LSP).
runmat-geometry-io = { workspace = true, optional = true, features = ["occt-native", "occt-kernel"] }
runmat-core = { path = "../runmat-core", version = "=0.7.0", optional = true }
runmat-value = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }

[features]
# No default features: the server links these tools and must not carry the RunMat runtime.
# `m-values` is enabled where `.m` design values run in-process: `runmat circuit check`
# (runmat-cli) and the runmat-design binary built with `--features m-values`.
default = []
# `design.render` through the Desktop's renderer (runmat-plot on wgpu, headless), with its
# overlay: without `egui-overlay` a 2D figure exports with no axes, ticks, labels, title or legend.
render = ["dep:runmat-plot", "runmat-plot/egui-overlay", "dep:pollster", "dep:glam"]
# Regenerate on OCCT (the kernel Desktop and the browser use), so check, inspect, render and
# export answer as the Desktop does; STEP export writes exact AP242.
occt = ["dep:runmat-geometry-io"]
# Design values computed by `.m` functions, run in a native RunMat session (m_values).
m-values = ["dep:runmat-core", "dep:runmat-value", "dep:futures"]

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "circuit_sim_pictures"
required-features = ["render"]

[[example]]
name = "drone_timing"
required-features = ["occt"]
