[package]
name = "runmat-execution-artifact"
version = "0.6.2"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Canonical execution bundles and program artifacts for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
aes-gcm = { workspace = true }
hkdf = { workspace = true }
minicbor = { workspace = true }
runmat-execution = { workspace = true }
runmat-package = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hpke = { workspace = true, features = ["getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
hpke = { workspace = true }

[dev-dependencies]
hex = "0.4"
tempfile = "3.12"
runmat-types = { workspace = true }
