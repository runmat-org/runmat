[package]
name = "runmat-mex"
version = "0.6.2"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Native C, C++, Fortran, and GPU MEX adapter for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
runmat-types = { workspace = true }
runmat-value = { workspace = true }
runmat-accelerate-api = { workspace = true }
runmat-execution = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
target-lexicon = { workspace = true }
tempfile = "3.12"
thiserror = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libloading = "0.8.9"
parking_lot = "0.12"
pollster = "0.3"
