[package]
name = "runmat-native-executor"
version = "0.6.2"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../LICENSE.md"
description = "Native IR invocation lifecycle and semantic execution host for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
futures = "0.3"
runmat-execution = { workspace = true }
runmat-hir = { workspace = true }
runmat-mir = { workspace = true }
runmat-native-codegen = { workspace = true, default-features = false }
runmat-time = { workspace = true }
runmat-types = { workspace = true }
runmat-value = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
runmat-gc = { workspace = true }
runmat-runtime = { workspace = true, features = ["plot-core"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
runmat-runtime = { workspace = true, features = ["plot-web"] }

[dev-dependencies]
runmat-builtins = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
