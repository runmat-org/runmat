[package]
name = "runmat-cad-wasm"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "The RunMat CAD design runtime: compile .part, .assembly and .drawing files to their projection and display for the Desktop and the browser, on the installed geometry kernel"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

# A Rust library only: the browser and Desktop worker run it inside the OCCT geometry host
# (runmat-geometry-wasm-host, emscripten), which links it like any dependency. A cdylib here
# would be linked on its own for emscripten too, and nothing loads it.
[lib]
crate-type = ["rlib"]

[dependencies]
runmat-cad = { path = "..", version = "=0.7.1" }
# Circuit boards placed in assemblies draw their 3D board model (`board_display`).
runmat-circuit = { path = "../../runmat-circuit", version = "=0.7.1" }
runmat-design-syntax = { workspace = true }
runmat-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
# The `#[wasm_bindgen]` entry points. Native and in-wasm Rust callers (the language server, the
# design tools) use the plain-Rust modules with `default-features = false`, so two crates'
# exports never meet in one wasm binary.
default = ["bindings"]
bindings = ["dep:wasm-bindgen"]
