[package]
name = "runmat-cad-wasm"
version = "0.6.2"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "WebAssembly entry points of the RunMat CAD design layer: compile .part and .assembly files to their projection and display for the Desktop and the browser"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
runmat-cad = { path = "..", version = "=0.6.2" }
runmat-design-syntax = { workspace = true }
runmat-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
