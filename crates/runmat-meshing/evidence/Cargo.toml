[package]
name = "runmat-meshing-evidence"
version = "0.6.2"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "Evidence artifact stages for RunMat meshing"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
runmat-geometry-io = { workspace = true, optional = true }
runmat-meshing-core = { workspace = true }
runmat-geometry-core = { workspace = true, optional = true }

[features]
default = []
dev-evidence = []
example-fixtures = ["dep:runmat-geometry-io", "dep:runmat-geometry-core"]
