[package]
name = "runmat-meshing-core"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "Deterministic meshing preparation contracts for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
runmat-types = { workspace = true }
runmat-cpu-execution = { workspace = true }
minicbor = { workspace = true }
num-bigint = "0.4"
runmat-canonical-codec = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
runmat-geometry-core = { workspace = true }
runmat-meshing-size = { workspace = true }
runmat-simulation-usage = { workspace = true }
robust = "1.2"

[dev-dependencies]
runmat-geometry-fixtures = { workspace = true }

[features]
default = []

[build-dependencies]
runmat-build-identity = { workspace = true }
