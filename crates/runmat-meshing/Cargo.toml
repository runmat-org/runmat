[package]
name = "runmat-meshing"
version = "0.5.0"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Topology-first meshing pipeline orchestration for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
serde = { workspace = true, features = ["derive"] }
runmat-geometry-core = { workspace = true }
runmat-meshing-cad = { workspace = true }
runmat-meshing-core = { workspace = true }
runmat-meshing-curve = { workspace = true }
runmat-meshing-plc = { workspace = true }
runmat-meshing-surface = { workspace = true }
runmat-meshing-tetrahedron = { workspace = true }
