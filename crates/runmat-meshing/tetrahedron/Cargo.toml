[package]
name = "runmat-meshing-tetrahedron"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "Tetrahedron meshing stage for RunMat meshing"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
runmat-time = { workspace = true }
runmat-types = { workspace = true }
minicbor = { workspace = true }
runmat-cpu-execution = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = "0.1"
runmat-canonical-codec = { workspace = true }
runmat-geometry-core = { workspace = true }
runmat-meshing-core = { workspace = true }
runmat-meshing-curve = { workspace = true }
runmat-meshing-size = { workspace = true }
runmat-simulation-usage = { workspace = true }
runmat-meshing-surface = { workspace = true }

[build-dependencies]
runmat-build-identity = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
