[package]
name = "runmat-meshing-surface"
version = "0.6.0"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "Surface meshing stage for RunMat meshing"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
serde = { workspace = true, features = ["derive"] }
