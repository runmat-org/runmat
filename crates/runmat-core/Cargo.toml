[package]
name = "runmat-core"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Host-agnostic RunMat execution engine (parser, interpreter, and JIT integration)"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
runmat-analysis-core = { workspace = true }
runmat-analysis-fea = { workspace = true }
runmat-analysis-execution = { workspace = true }
runmat-meshing-core = { workspace = true }
runmat-simulation-usage = { workspace = true }
runmat-geometry-core = { workspace = true }

runmat-fea-source = { workspace = true }
runmat-value = { workspace = true }
runmat-types = { workspace = true }
runmat-lexer = { workspace = true }
runmat-parser = { workspace = true }
runmat-hir = { workspace = true }
runmat-mir = { workspace = true, features = ["compiler"] }
runmat-vm = { workspace = true }
runmat-config = { workspace = true }
runmat-execution = { workspace = true }
runmat-execution-artifact = { workspace = true }
runmat-execution-runner = { workspace = true }
runmat-package = { workspace = true }
runmat-static-analysis = { workspace = true }
runmat-test = { workspace = true }
runmat-accelerate = { workspace = true }
runmat-accelerate-api = { workspace = true }
runmat-gc = { workspace = true }
runmat-builtins = { workspace = true }
runmat-telemetry = { workspace = true }
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
uuid = { version = "1", features = ["v4"], default-features = false }
runmat-time = { workspace = true }
runmat-filesystem = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
futures = "0.3"
hashbrown = "=0.16.1"
allocator-api2 = "=0.2.21"

[target.'cfg(target_arch = "wasm32")'.dependencies.uuid]
version = "1"
features = ["v4", "js"]
default-features = false

[features]
gui = ["runmat-runtime/gui"]
default = ["jit"]
jit = []
occt-native = ["runmat-runtime/occt-native"]
occt-wasm-host = ["runmat-runtime/occt-wasm-host"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
runmat-accelerate = { workspace = true, features = ["cuda"] }
runmat-execution-artifact = { workspace = true }
runmat-java = { workspace = true }
runmat-python = { workspace = true }
runmat-mex = { workspace = true }
runmat-native-ffi = { workspace = true }
runmat-process-host = { workspace = true }
runmat-runtime = { workspace = true, features = ["plot-core"] }
runmat-native-codegen = { workspace = true, features = ["compiler"] }
runmat-native-executor = { workspace = true }
runmat-jit = { workspace = true }
pollster = "0.3"
stacker = "0.1"
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "time", "net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
runmat-runtime = { workspace = true, features = ["plot-web"] }

[dev-dependencies]
async-trait = "0.1"
runmat-accelerate-api = { workspace = true, features = ["test-support"] }
futures = "0.3"
wasm-bindgen-test = "0.3"
tempfile = "3"
toml = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
runmat-runtime = { workspace = true, features = ["interaction-test-hooks", "plot-core"] }

[[test]]
name = "python_interop"
path = "tests/python_interop.rs"
harness = false
