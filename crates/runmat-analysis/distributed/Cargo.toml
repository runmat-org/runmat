[package]
name = "runmat-analysis-distributed"
version = "0.7.0"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "Domain decomposition for one finite element problem across cooperating worker processes"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
faer = { version = "=0.24.4", default-features = false, features = ["std", "linalg", "sparse-linalg"] }
thiserror = { workspace = true }
runmat-simulation-usage = { workspace = true }

[dev-dependencies]
