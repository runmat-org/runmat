[package]
name = "runmat-analysis-core"
version = "0.7.0"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../../LICENSE.md"
description = "Solver-agnostic analysis model and validation for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
runmat-geometry-core = { workspace = true }
runmat-types = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
schemars = { version = "0.8", optional = true }

[features]
tool-schema = ["dep:schemars"]

[dev-dependencies]
serde_json = { workspace = true }
