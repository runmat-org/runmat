[package]
name = "runmat-hir"
version = "0.6.2"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../LICENSE.md"
description = "High-level IR for RunMat with type inference and lowering utilities"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
runmat-types = { workspace = true }
runmat-parser = { workspace = true }
runmat-builtins = { workspace = true }
runmat-execution = { workspace = true }
runmat-test = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
wasm-bindgen-test = "0.3"
