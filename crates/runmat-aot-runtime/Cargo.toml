[package]
name = "runmat-aot-runtime"
version = "0.7.1"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Linked RunMat AOT runtime entry and process-image execution host"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
runmat-fea-admission-native = { workspace = true }
runmat-core = { workspace = true, default-features = false, optional = true }
runmat-execution = { workspace = true }
runmat-execution-artifact = { workspace = true }
runmat-config = { workspace = true }
runmat-accelerate = { workspace = true }
runmat-accelerate-api = { workspace = true }
runmat-native-codegen = { workspace = true, default-features = false }
runmat-native-executor = { workspace = true }
runmat-native-ffi = { workspace = true }
runmat-mex = { workspace = true }
runmat-java = { workspace = true }
runmat-python = { workspace = true }
runmat-process-host = { workspace = true }
runmat-runtime = { workspace = true, features = ["plot-core"] }
runmat-types = { workspace = true }
runmat-value = { workspace = true }
runmat-gc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
tempfile = "3.12"
tracing = "0.1"

[features]
default = ["wgpu", "cuda", "stock-hosted-factories"]
wgpu = ["runmat-accelerate/wgpu", "runmat-runtime/wgpu"]
cuda = ["runmat-accelerate/cuda"]
source-evaluation = ["dep:runmat-core"]
# A custom target-built embedding archive provides these same qualified
# symbols itself and builds this runtime without the stock host factories.
stock-hosted-factories = []

[dev-dependencies]
runmat-core = { workspace = true }
runmat-builtins = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
