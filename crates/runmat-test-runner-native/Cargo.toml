[package]
name = "runmat-test-runner-native"
version = "0.7.0"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Native process, filesystem artifact, and telemetry adapters for RunMat tests"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
runmat-simulation-usage = { workspace = true }
runmat-accelerate = { workspace = true }
runmat-config = { workspace = true, features = ["accelerate"] }
runmat-aot = { workspace = true }
runmat-execution = { workspace = true }
runmat-execution-runner-native = { workspace = true }
runmat-runtime = { workspace = true }
runmat-execution-artifact = { workspace = true }
runmat-process-host = { workspace = true }
runmat-test = { workspace = true }
runmat-test-runner = { workspace = true }
runmat-package = { workspace = true }
runmat-core = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
sha2 = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
runmat-native-codegen = { workspace = true }
runmat-native-ffi = { workspace = true }
runmat-types = { workspace = true }
tempfile = "3.12"
