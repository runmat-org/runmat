[package]
name = "runmat-config"
version = "0.7.1"
edition = "2021"
description = "Shared configuration schema and loaders for RunMat"
license-file = "../../LICENSE.md"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[features]
accelerate = ["runmat-accelerate"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
dirs = "5.0"
log = { workspace = true }
runmat-accelerate = { workspace = true, optional = true }
runmat-filesystem = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.12"

[dev-dependencies]
futures = "0.3"
once_cell = "1"
