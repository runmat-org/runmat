[package]
name = "runmat-package"
version = "0.6.1"
edition = "2021"
description = "Portable package identities, resolution graph, and lockfile domain for RunMat"
license = "Apache-2.0"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
futures = "0.3"
runmat-config = { workspace = true }
runmat-filesystem = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
url = { workspace = true }

[dev-dependencies]
tempfile = "3.12"
wasm-bindgen-test = "0.3"
