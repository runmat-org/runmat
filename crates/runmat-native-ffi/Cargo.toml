[package]
name = "runmat-native-ffi"
version = "0.6.2"
edition = "2021"
authors = ["Dystr Team"]
license-file = "../../LICENSE.md"
description = "Native shared-library interoperability for RunMat"
homepage = "https://runmat.com"
repository = "https://github.com/runmat-org/runmat"

[dependencies]
runmat-types = { workspace = true }
runmat-value = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
target-lexicon = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libffi = "=5.2.0"
libloading = "0.8.9"
tempfile = "3.12"

[dev-dependencies]
