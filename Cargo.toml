resolver = "2"

[workspace.dependencies]
clarabel = { package = "runmat-clarabel", version = "=0.6.2", path = "crates/runmat-clarabel", default-features = false }
runmat-build-identity = { version = "=0.6.2", path = "crates/runmat-build-identity" }
runmat-cpu-execution = { version = "=0.6.2", path = "crates/runmat-cpu-execution" }
runmat-simulation-usage = { version = "=0.6.2", path = "crates/runmat-simulation-usage" }
runmat-sparse-solvers = { version = "=0.6.2", path = "crates/runmat-sparse-solvers" }
runmat-sparse-accelerate = { version = "=0.6.2", path = "crates/runmat-sparse-accelerate" }
# External dependencies used across multiple crates
sobol = "=1.0.2"
wgpu = "24.0.0"
inventory = "0.1"
syn = { version = "1", features = ["full"] }
quote = "1"
proc-macro2 = "1"
logos = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
minicbor = { version = "2.3", features = ["alloc", "derive", "std"] }
hpke = { version = "=0.14.0", default-features = false, features = [
    "alloc",
    "x25519",
    "aes",
] }
aes-gcm = "0.10"
hkdf = "0.12"
zeroize = "1"
ed25519-dalek = "2"
tokio = { version = "1", default-features = false }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
thiserror = "1"
miette = "7"
chrono = { version = "0.4.42", features = ["serde"] }
anyhow = "1"
cranelift = "0.115"
cranelift-jit = "0.115"
cranelift-module = "0.115"
cranelift-codegen = "0.115"
cranelift-native = "0.115"
cranelift-object = "0.115"
target-lexicon = "0.12"
tower-lsp = "0.20"
once_cell = "1"
semver = { version = "1", features = ["serde"] }
# SHA-256 in hardware where the CPU has it (0.10 needs the uncached sha2-asm on aarch64).
sha2 = { version = "0.11", default-features = false }
# HMAC and HKDF 0.12 are built on digest 0.10.
sha2-mac = { package = "sha2", version = "0.10" }
hex = "0.4"
hmac = "0.12"
url = { version = "2", features = ["serde"] }

# Internal workspace crates
runmat-lexer = { version = "=0.6.2", path = "crates/runmat-lexer" }
runmat-parser = { version = "=0.6.2", path = "crates/runmat-parser" }
runmat-fea-syntax = { version = "=0.6.2", path = "crates/runmat-fea-syntax" }
