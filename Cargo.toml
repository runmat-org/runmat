runmat-analysis-core = { version = "=0.6.2", path = "crates/runmat-analysis/core" }
runmat-analysis-language = { version = "=0.6.2", path = "crates/runmat-analysis/language" }
runmat-analysis-fea = { version = "=0.6.2", path = "crates/runmat-analysis/fea" }
runmat-analysis-execution = { version = "=0.6.2", path = "crates/runmat-analysis/execution" }
runmat-analysis-distributed = { version = "=0.6.2", path = "crates/runmat-analysis/distributed" }
