runmat-meshing-execution = { version = "=0.6.2", path = "crates/runmat-meshing/execution" }
runmat-meshing-size = { version = "=0.6.2", path = "crates/runmat-meshing/size" }
runmat-meshing-curve = { version = "=0.6.2", path = "crates/runmat-meshing/curve" }
runmat-meshing-surface = { version = "=0.6.2", path = "crates/runmat-meshing/surface" }
runmat-meshing-tetrahedron = { version = "=0.6.2", path = "crates/runmat-meshing/tetrahedron" }

# Optimize the largest release archive producers as whole crates without
# changing optimization level, target CPU, features, or unwind semantics.
[profile.release.package.runmat-runtime]
codegen-units = 1

[profile.release.package.runmat-analysis-fea]
codegen-units = 1

[profile.release.package.runmat-builtins]
codegen-units = 1

# Large test harnesses otherwise spend minutes importing between codegen units
# even with Cargo's default `lto = false` (local ThinLTO). Keep numerical crate
# optimization below, but make verification builds skip that cross-unit pass.
[profile.test]
lto = "off"

# Keep numerical development runs representative without release packaging.
# Debug information, assertions and overflow checks retain their dev defaults.
# Exact/adaptive predicates and their arithmetic leaves must be optimized too;
# optimizing only their callers leaves near-degenerate CAD work prohibitively slow.

[profile.dev.package.runmat-meshing-core]
opt-level = 3

[profile.dev.package.runmat-meshing-size]
opt-level = 3

[profile.dev.package.runmat-meshing-curve]
opt-level = 3

[profile.dev.package.runmat-meshing-surface]
opt-level = 3

[profile.dev.package.runmat-meshing-tetrahedron]
opt-level = 3

[profile.dev.package.runmat-geometry-core]
opt-level = 3

[profile.dev.package.runmat-geometry-io]
opt-level = 3

